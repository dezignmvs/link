<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyLinks Dashboard</title>
    <!-- Iconify for icons -->
    <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>
    <!-- Font: Satoshi -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">

    <style>
        /* Original Structure + New Theme */
        :root {
            /* Font */
            --font-main: 'Satoshi', sans-serif;

            /* Light Theme Colors */
            --light-bg-body: #f4f7fe;
            --light-bg-card: #ffffff;
            --light-bg-sidebar: #ffffff;
            --light-bg-header: #ffffff;
            --light-bg-input: #f4f7fe;
            --light-bg-hover: #eef2f9;
            --light-bg-active: #e5eaf5;
            --light-bg-breadcrumbs: #ffffff;
            --light-bg-modal: #ffffff; /* Added */
            --light-text-primary: #1a202c;
            --light-text-secondary: #718096;
            --light-text-placeholder: #a0aec0;
            --light-border-color: #e2e8f0;
            --light-shadow-color: rgba(0, 0, 0, 0.05);

            /* Dark Theme Colors */
            --dark-bg-body: #1a202c;
            --dark-bg-card: #2d3748;
            --dark-bg-sidebar: #2d3748;
            --dark-bg-header: #2d3748;
            --dark-bg-modal: #2d3748; /* Added */
            --dark-bg-input: #4a5568;
            --dark-bg-hover: #4a5568;
            --dark-bg-active: #718096;
            --dark-bg-breadcrumbs: #2d3748;
            --dark-text-primary: #e2e8f0;
            --dark-text-secondary: #a0aec0;
            --dark-text-placeholder: #718096;
            --dark-border-color: #4a5568;
            --dark-shadow-color: rgba(0, 0, 0, 0.3);

            /* Accent Colors */
            --accent-green: #10b981;
            --accent-green-dark: #059669;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-indigo: #4f46e5;

            /* Sidebar Sizes */
            --sidebar-width-full: 260px;
            --sidebar-width-mini: 80px;

            /* Transitions */
            --transition-speed: 0.25s;
            --transition-ease: ease-in-out;
        }

        /* --- Base Layout & Typography --- */
        html { box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }
        body {
            font-family: var(--font-main); margin: 0; background-color: var(--light-bg-body);
            color: var(--light-text-primary); min-height: 100vh; display: flex;
            transition: background-color var(--transition-speed) var(--transition-ease), color var(--transition-speed) var(--transition-ease);
            overflow-x: hidden; font-size: 14px;
        }
        h1, h2, h3, h4, h5, h6 { margin: 0; color: var(--light-text-primary); font-family: var(--font-main); font-weight: 600; }
        ::placeholder { color: var(--light-text-placeholder); opacity: 1; }
        /* Iconify Base Style */
        .iconify { vertical-align: -0.125em; /* Better alignment */ line-height: 1; }

        /* --- Dark Theme Overrides --- */
        body.dark-theme { background-color: var(--dark-bg-body); color: var(--dark-text-primary); }
        body.dark-theme h1, body.dark-theme h2, body.dark-theme h3, body.dark-theme h4, body.dark-theme h5, body.dark-theme h6 { color: var(--dark-text-primary); }
        body.dark-theme ::placeholder { color: var(--dark-text-placeholder); }
        body.dark-theme .app-sidebar, body.dark-theme .app-header, body.dark-theme .app-breadcrumbs, body.dark-theme .link-card, body.dark-theme .admin-form-container, body.dark-theme .modal {
            background-color: var(--dark-bg-card); border-color: var(--dark-border-color); box-shadow: 0 1px 3px var(--dark-shadow-color);
        }
        body.dark-theme .sidebar-logo { border-bottom-color: var(--dark-border-color); color: var(--dark-text-primary);}
        body.dark-theme .sidebar-nav a { color: var(--dark-text-secondary); }
        body.dark-theme .sidebar-nav a:hover { background-color: var(--dark-bg-hover); color: var(--dark-text-primary); }
        body.dark-theme .sidebar-nav li.active a { background-color: var(--accent-green); color: #fff; box-shadow: 0 4px 8px rgba(16, 185, 129, 0.3); }
        body.dark-theme .sidebar-nav li.active a .iconify { color: #fff; }

        body.dark-theme .sidebar-toggle-desktop, body.dark-theme .mobile-sidebar-toggle, body.dark-theme .header-icon-button, body.dark-theme .back-btn, body.dark-theme .customize-btn {
            background-color: transparent; border: 1px solid var(--dark-border-color); color: var(--dark-text-secondary);
        }
        body.dark-theme .sidebar-toggle-desktop:hover, body.dark-theme .mobile-sidebar-toggle:hover, body.dark-theme .header-icon-button:hover, body.dark-theme .back-btn:hover, body.dark-theme .customize-btn:hover {
             background-color: var(--dark-bg-hover); border-color: var(--dark-text-secondary); color: var(--dark-text-primary);
        }

        body.dark-theme .search-bar input { background-color: var(--dark-bg-input); border-color: var(--dark-border-color); color: var(--dark-text-primary); }
        body.dark-theme .search-bar input:focus { border-color: var(--accent-indigo); background-color: var(--dark-bg-card); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3); }
        body.dark-theme .search-bar .search-icon { color: var(--dark-text-secondary); }
        body.dark-theme .app-breadcrumbs a { color: var(--dark-text-primary); }
        body.dark-theme .app-breadcrumbs li { color: var(--dark-text-secondary); }

        body.dark-theme .link-card .card-header { border-bottom-color: var(--dark-border-color); background: linear-gradient(to right, rgba(255,255,255,0.03), rgba(255,255,255,0)); }
        body.dark-theme .link-card .card-title { color: var(--dark-text-primary); }
        body.dark-theme .link-card .card-subtitle { color: var(--dark-text-secondary); }
        body.dark-theme .link-card .delete-btn { color: var(--dark-text-secondary); background-color: rgba(255, 255, 255, 0.1);}
        body.dark-theme .link-card .delete-btn:hover { background-color: rgba(239, 68, 68, 0.1); color: var(--accent-red); }
        body.dark-theme .view-btn { border: 1px solid var(--accent-blue); background: transparent; color: var(--accent-blue); }
        body.dark-theme .view-btn:hover { background: rgba(59, 130, 246, 0.15); }

        body.dark-theme .admin-form-container h2 { color: var(--dark-text-primary); }
        body.dark-theme .admin-form-container label { color: var(--dark-text-secondary); }
        body.dark-theme .admin-form-container input, body.dark-theme .admin-form-container select, body.dark-theme input[type="color"] { background-color: var(--dark-bg-input); border-color: var(--dark-border-color); color: var(--dark-text-primary); }
        body.dark-theme input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        body.dark-theme input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
        body.dark-theme .admin-form-container ::placeholder { color: var(--dark-text-placeholder); }
        body.dark-theme .admin-form-container button[type="submit"] { border: 1px solid var(--accent-green); background: transparent; color: var(--accent-green); }
        body.dark-theme .admin-form-container button[type="submit"]:hover { background: rgba(16, 185, 129, 0.15); box-shadow: none; }

        body.dark-theme .app-footer { color: var(--dark-text-secondary); border-top-color: var(--dark-border-color); }
        body.dark-theme .modal { background-color: var(--dark-bg-modal); border-color: var(--dark-border-color);}
        body.dark-theme .modal h2 { color: var(--dark-text-primary); }
        body.dark-theme .modal label { color: var(--dark-text-secondary); }
        body.dark-theme .modal input, body.dark-theme .modal select { background-color: var(--dark-bg-input); border-color: var(--dark-border-color); color: var(--dark-text-primary); }
        body.dark-theme .modal table { border-color: var(--dark-border-color); }
        body.dark-theme .modal th, body.dark-theme .modal td { border-color: var(--dark-border-color); }
        body.dark-theme .modal th { background-color: var(--dark-bg-input); }
        body.dark-theme .modal .category-table td { color: var(--dark-text-primary); }

        body.dark-theme .modal .btn-primary { border: 1px solid var(--accent-green); background: transparent; color: var(--accent-green); }
        body.dark-theme .modal .btn-primary:hover { background: rgba(16, 185, 129, 0.15); box-shadow: none; }
        body.dark-theme .modal .btn-secondary { background-color: transparent; color: var(--dark-text-secondary); border-color: var(--dark-border-color); }
        body.dark-theme .modal .btn-secondary:hover { background-color: var(--dark-bg-hover); border-color: var(--dark-text-secondary); color: var(--dark-text-primary); }
         body.dark-theme .modal .btn-danger { border: 1px solid var(--accent-red); background-color: transparent; color: var(--accent-red); }
        body.dark-theme .modal .btn-danger:hover { background-color: rgba(239, 68, 68, 0.15); box-shadow: none; }

        /* --- App Container & Main Content --- */
        .app-container {
             flex-grow: 1; display: flex; flex-direction: column; min-height: 100vh;
             width: calc(100% - var(--sidebar-width-full));
             transition: width var(--transition-speed) var(--transition-ease);
             position: relative;
        }
        .app-container.sidebar-mini { width: calc(100% - var(--sidebar-width-mini)); }
        .app-main-content { flex-grow: 1; padding: 24px; padding-bottom: 40px; max-width: 100%; }
        .container { max-width: 1200px; margin: 0 auto; }

        /* --- Sidebar (app-sidebar) --- */
        .app-sidebar {
            width: var(--sidebar-width-full); background-color: var(--light-bg-sidebar); border-right: 1px solid var(--light-border-color);
            flex-shrink: 0; height: 100vh; position: sticky; top: 0;
            display: flex; flex-direction: column;
            transition: width var(--transition-speed) var(--transition-ease), transform var(--transition-speed) var(--transition-ease), background-color var(--transition-speed) var(--transition-ease);
            box-shadow: 2px 0 5px var(--light-shadow-color);
        }
        .sidebar-logo {
            font-size: 1.4rem; font-weight: 700; color: var(--light-text-primary); padding: 18px 24px;
            flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; /* space-between for toggle */
            gap: 12px; overflow: hidden; position: relative; border-bottom: 1px solid var(--light-border-color); height: 60px;
        }
        .sidebar-logo-content { display: flex; align-items: center; gap: 10px; overflow: hidden; flex-grow: 1; }
        .sidebar-logo .iconify { color: var(--accent-green); font-size: 1.6rem; } /* Updated selector */
        .sidebar-logo-text { transition: opacity 0.1s ease, transform 0.2s ease; white-space: nowrap; margin-left: 5px; transform: translateX(0); }

        /* Sidebar Toggle Desktop - Original Position */
        .sidebar-toggle-desktop {
            background: none; border: none; color: var(--light-text-secondary); padding: 5px; cursor: pointer;
            font-size: 1.1rem; /* Adjust size */ display: flex; align-items: center; justify-content: center;
            border-radius: 50%; width: 32px; height: 32px; flex-shrink: 0;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
        }
        .sidebar-toggle-desktop:hover { color: var(--light-text-primary); background-color: var(--light-bg-hover); }

        .sidebar-nav-container { padding: 16px; overflow-y: auto; flex-grow: 1; scrollbar-width: thin; scrollbar-color: var(--light-border-color) transparent; }
        .sidebar-nav-container::-webkit-scrollbar { width: 5px; }
        .sidebar-nav-container::-webkit-scrollbar-track { background: transparent; }
        .sidebar-nav-container::-webkit-scrollbar-thumb { background-color: var(--light-border-color); border-radius: 10px; border: 1px solid transparent; }

        .sidebar-nav-title { font-size: 0.7rem; font-weight: 600; color: var(--light-text-secondary); text-transform: uppercase; letter-spacing: 0.8px; padding: 16px 10px 8px; white-space: nowrap; overflow: hidden; transition: opacity 0.1s ease; }
        .sidebar-nav { list-style: none; padding: 0; margin: 0; }
        .sidebar-nav li a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 6px; text-decoration: none; font-weight: 500; color: var(--light-text-secondary); transition: background var(--transition-speed) var(--transition-ease), color var(--transition-speed) var(--transition-ease), box-shadow var(--transition-speed) var(--transition-ease); white-space: nowrap; overflow: hidden; font-size: 0.9rem; position: relative; margin-bottom: 4px; }
        .sidebar-nav li a:hover { background-color: var(--light-bg-hover); color: var(--light-text-primary); }
        .sidebar-nav li.active a { background-color: var(--accent-green); color: #fff; box-shadow: 0 4px 8px rgba(16, 185, 129, 0.3); }
        .sidebar-nav li.active a .iconify { color: #fff; } /* Updated selector */
        .sidebar-nav li a .iconify { font-size: 1.1rem; width: 1.5em; text-align: center; flex-shrink: 0; transition: color var(--transition-speed) var(--transition-ease); } /* Updated selector */

        /* Mini Sidebar Styles */
        .app-sidebar.mini { width: var(--sidebar-width-mini); }
        .app-sidebar.mini .sidebar-logo { padding: 18px 10px; justify-content: center; }
        .app-sidebar.mini .sidebar-logo-content { width: 0; opacity: 0; visibility: hidden; }
        .app-sidebar.mini .sidebar-logo-text { opacity: 0; transform: translateX(-20px); transition-delay: 0s; }
        .app-sidebar.mini .sidebar-toggle-desktop { margin: 0 auto; }
        .app-sidebar.mini .sidebar-nav-container { padding: 16px 8px; }
        .app-sidebar.mini .sidebar-nav-title { opacity: 0; height: 0; padding: 0; margin: 0; overflow: hidden; }
        .app-sidebar.mini .sidebar-nav li a { justify-content: center; padding: 12px 10px; }
        .app-sidebar.mini .sidebar-nav li a span { opacity: 0; width: 0; visibility: hidden; height: 0; overflow: hidden; }
        .app-sidebar.mini .sidebar-nav li a .iconify { margin: 0; width: auto; font-size: 1.3rem; } /* Updated selector */

        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6); z-index: 999; opacity: 0; visibility: hidden; transition: opacity var(--transition-speed) var(--transition-ease), visibility 0s var(--transition-speed); }
        .sidebar-overlay.active { opacity: 1; visibility: visible; transition: opacity var(--transition-speed) var(--transition-ease), visibility 0s 0s; }

        /* --- App Header (Restored) --- */
         .app-header {
             display: flex; justify-content: space-between; align-items: center; padding: 0 24px;
             background-color: var(--light-bg-header); border-bottom: 1px solid var(--light-border-color);
             flex-shrink: 0; box-shadow: 0 1px 3px var(--light-shadow-color); height: 60px;
             transition: background-color var(--transition-speed) var(--transition-ease), border-color var(--transition-speed) var(--transition-ease);
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header-controls { display: flex; gap: 12px; align-items: center; margin-left: auto; }

        /* Mobile Sidebar Toggle - Header Version */
         .mobile-sidebar-toggle {
             background-color: transparent; color: var(--light-text-secondary); border: 1px solid var(--light-border-color);
             width: 38px; height: 38px; border-radius: 6px; font-size: 1.1rem; cursor: pointer;
             display: none; align-items: center; justify-content: center;
             transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease, border-color 0.2s ease;
        }
         .mobile-sidebar-toggle:hover { background-color: var(--light-bg-hover); color: var(--light-text-primary); border-color: var(--light-text-secondary); }

        .search-bar { position: relative; max-width: 350px; flex-grow: 1; }
        .search-bar .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--light-text-secondary); font-size: 1.2rem; } /* Adjusted size */
        .search-bar input { width: 100%; padding: 8px 12px 8px 40px; background-color: var(--light-bg-input); border: 1px solid var(--light-border-color); border-radius: 6px; color: var(--light-text-primary); font-family: var(--font-main); font-size: 0.9rem; transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s; }
        .search-bar input:focus { outline: none; border-color: var(--accent-indigo); background-color: var(--light-bg-card); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }
        .header-icon-button { background-color: var(--light-bg-card); color: var(--light-text-secondary); border: 1px solid var(--light-border-color); width: 38px; height: 38px; border-radius: 6px; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease, border-color 0.2s ease; }
        .header-icon-button:hover { background-color: var(--light-bg-hover); color: var(--light-text-primary); border-color: var(--light-text-secondary); }

         /* --- App Breadcrumbs (Restored) --- */
         .app-breadcrumbs {
             padding: 10px 24px; background-color: var(--light-bg-breadcrumbs);
             border-bottom: 1px solid var(--light-border-color); flex-shrink: 0;
             transition: background-color var(--transition-speed) var(--transition-ease), border-color var(--transition-speed) var(--transition-ease);
             font-size: 0.85rem; box-shadow: 0 1px 2px var(--light-shadow-color);
        }
        .app-breadcrumbs ul { margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 8px; }
        .app-breadcrumbs li { color: var(--light-text-secondary); }
        .app-breadcrumbs li:not(:last-child)::after { content: '/'; margin-left: 8px; color: var(--light-text-secondary); opacity: 0.6; }
        .app-breadcrumbs a { color: var(--light-text-primary); text-decoration: none; font-weight: 500; }
        .app-breadcrumbs a:hover { text-decoration: underline; color: var(--accent-blue); }

        /* --- Dashboard Grid & Link Cards --- */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; padding-top: 24px; }
        .dashboard-grid .no-search-results {
            grid-column: 1 / -1; /* Span full grid */
            text-align: center;
            color: var(--light-text-secondary);
            font-size: 1rem;
            padding: 40px;
        }
        body.dark-theme .dashboard-grid .no-search-results {
            color: var(--dark-text-secondary);
        }
        .link-card { background-color: var(--light-bg-card); border-radius: 8px; box-shadow: 0 1px 3px var(--light-shadow-color); border: 1px solid var(--light-border-color); min-height: 160px; display: flex; flex-direction: column; overflow: hidden; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .link-card.hidden { display: none; }
        .link-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px var(--light-shadow-color); }
        .card-header { padding: 16px; border-bottom: 1px solid var(--light-border-color); min-height: 60px; background-color: transparent; display: flex; justify-content: space-between; align-items: center; }
        .card-initial-circle { background-color: var(--accent-green); width: 36px; height: 36px; border-radius: 50%; color: #fff; font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: var(--font-main);}
        .delete-btn { background-color: transparent; color: var(--light-text-secondary); border: none; font-size: 1rem; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s, color 0.2s, transform 0.1s ease; cursor: pointer;}
        .delete-btn:hover { background-color: rgba(239, 68, 68, 0.1); color: var(--accent-red); }
        .card-content { flex-grow: 1; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 0.95rem; font-weight: 600; color: var(--light-text-primary); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-subtitle { font-size: 0.8rem; color: var(--light-text-secondary); margin-bottom: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .view-btn { color: var(--accent-blue); background-color: rgba(59, 130, 246, 0.1); border: 1px solid transparent; width: 100%; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; text-decoration: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background-color 0.2s ease, transform 0.1s ease, color 0.2s ease; margin-top: auto; }
        .view-btn .iconify { font-size: 0.9em; } /* Updated selector */
        .view-btn:hover { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; }

        /* --- Admin Form Page --- */
        .admin-form-container { background-color: var(--light-bg-card); border: 1px solid var(--light-border-color); box-shadow: 0 1px 3px var(--light-shadow-color); max-width: 600px; margin: 40px auto; padding: 32px; border-radius: 8px; }
        .admin-form-container h2 { font-size: 1.25rem; }
        .admin-form-header { border-bottom: 1px solid var(--light-border-color); padding-bottom: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        .back-btn { background-color: var(--light-bg-input); color: var(--light-text-secondary); border: 1px solid var(--light-border-color); width: 38px; height: 38px; border-radius: 6px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease; flex-shrink: 0; }
        .back-btn:hover { background-color: var(--light-bg-hover); color: var(--light-text-primary); }
        .customize-btn { background-color: var(--light-bg-input); color: var(--light-text-secondary); border: 1px solid var(--light-border-color); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: background-color 0.2s, color 0.2s, transform 0.1s ease, border-color 0.2s; flex-shrink: 0; }
        .customize-btn:hover { background-color: var(--light-bg-hover); color: var(--light-text-primary); border-color: var(--light-text-secondary); }
        .customize-btn .iconify { font-size: 1.1em; } /* Updated selector */
        .customize-btn span { transition: display 0s; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: var(--light-text-secondary); font-size: 0.85rem; }
        .form-group input[type="color"] { background-color: var(--light-bg-input); border: 1px solid var(--light-border-color); padding: 2px; height: 40px; border-radius: 6px; width: 100%; box-sizing: border-box; cursor: pointer; }
        .form-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 4px; }
        .form-group input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(0,0,0,0.1); border-radius: 4px; }
        .form-group input, .form-group select { border: 1px solid var(--light-border-color); background-color: var(--light-bg-input); color: var(--light-text-primary); width: 100%; padding: 10px 12px; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; font-family: var(--font-main); transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease; }
        .form-group input:focus, .form-group select:focus, .form-group input[type="color"]:focus { border-color: var(--accent-indigo); background-color: var(--light-bg-card); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); outline: none;}

<body>

    <!-- Javascript (Implementations Added) -->
    <script type="module">
        // --- Firebase Imports ---
        // CORRECTED: Removed extra dot from firebase-app..js
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, setLogLevel, updateDoc, writeBatch, query, where, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Config ---
         const firebaseConfig = typeof __firebase_config !== 'undefined'
           ? JSON.parse(__firebase_config)
           : { apiKey: "YOUR_API_KEY", authDomain: "YOUR_AUTH_DOMAIN", projectId: "YOUR_PROJECT_ID", appId: "YOUR_APP_ID" /* ... other keys */ };

        // --- App ID (Mandatory for Firestore paths) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let app; let db; let auth; let userId = null;
        let linksUnsubscribe = null; let categoriesUnsubscribe = null;

        try {
             app = initializeApp(firebaseConfig);
             db = getFirestore(app);
             auth = getAuth(app);
             try { setLogLevel('debug'); } catch (e) { console.warn("Could not set Firestore log level:", e); }
        } catch (error) {
            console.error("FATAL: Firebase initialization failed:", error);
            document.getElementById('links-container').innerHTML = `<p class='no-search-results'>Error connecting to service. Please check configuration.</p>`;
        }

        let linksCollectionRef = null; let categoriesCollectionRef = null;

        // --- DOM Elements ---
        const body = document.body; const sidebar = document.getElementById('sidebar');
        const sidebarNav = document.getElementById('sidebar-nav');
        // --- Separate Toggles ---
        const sidebarToggleDesktop = document.getElementById('sidebar-toggle-desktop');
        const mobileSidebarToggle = document.getElementById('mobile-sidebar-toggle');
        // ---
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const mainContent = document.getElementById('main-content');
        const publicPage = document.getElementById('public-page'); const adminPage = document.getElementById('admin-page');
        const addBtn = document.getElementById('add-btn'); const themeToggleBtn = document.getElementById('theme-toggle');
        const fullscreenToggleBtn = document.getElementById('fullscreen-toggle');
        const linksContainer = document.getElementById('links-container');
        const addLinkForm = document.getElementById('add-link-form'); const linkName = document.getElementById('link-name');
        const linkCategorySelect = document.getElementById('link-category-select'); const linkUrl = document.getElementById('link-url');
        const submitBtn = document.getElementById('submit-btn'); const searchInput = document.getElementById('search-input');
        const appHeader = document.querySelector('.app-header');
        const breadcrumbList = document.getElementById('breadcrumb-list');
        const customizeCategoriesBtn = document.getElementById('customize-categories-btn');
        const categoryListModal = document.getElementById('category-list-modal');
        const categoryEditModal = document.getElementById('category-edit-modal');
        const categoryTableBody = document.querySelector('#category-table tbody');
        const addNewCategoryBtn = document.getElementById('add-new-category-btn');
        const categoryEditForm = document.getElementById('category-edit-form');
        const categoryEditTitle = document.getElementById('category-edit-title');
        const categoryEditId = document.getElementById('category-edit-id');
        const categoryEditOriginalName = document.getElementById('category-edit-original-name');
        const categoryEditName = document.getElementById('category-edit-name');
        const categoryEditIcon = document.getElementById('category-edit-icon');
        const categoryEditColor = document.getElementById('category-edit-color');
        const categorySaveBtn = document.getElementById('category-save-btn');
        const backToPublicBtn = document.getElementById('back-to-public-btn');

        let allLinksData = []; let allCategoriesData = []; let currentCategory = 'All';
        const mobileBreakpoint = 992;

        // --- Theme Toggle Logic ---
        function applyTheme(isDark) {
             const themeIcon = isDark ? 'mdi:weather-sunny' : 'mdi:moon-waning-crescent';
             if (isDark) { 
                 body.classList.add('dark-theme'); 
                 localStorage.setItem('theme', 'dark'); 
            } else { 
                 body.classList.remove('dark-theme'); 
                 localStorage.setItem('theme', 'light'); 
            }
            if(themeToggleBtn) themeToggleBtn.innerHTML = `<span class="iconify" data-icon="${themeIcon}"></span>`;
         }
        if(themeToggleBtn) themeToggleBtn.addEventListener('click', () => applyTheme(!body.classList.contains('dark-theme')));

        // --- Fullscreen Toggle Logic ---
        if(fullscreenToggleBtn) fullscreenToggleBtn.addEventListener('click', () => {
             if (!document.fullscreenElement) {
                 document.documentElement.requestFullscreen().catch(err => {
                     console.warn(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                 });
            } else {
                 if (document.exitFullscreen) {
                     document.exitFullscreen();
                 }
            }
        });
        document.addEventListener('fullscreenchange', () => {
            if(fullscreenToggleBtn) {
                 const icon = document.fullscreenElement ? 'mdi:arrow-collapse' : 'mdi:arrow-expand';
                 fullscreenToggleBtn.innerHTML = `<span class="iconify" data-icon="${icon}"></span>`;
            }
        });

        // --- Sidebar Toggle Logic (Original Structure) ---
        if (mobileSidebarToggle) mobileSidebarToggle.addEventListener('click', () => {
             sidebar.classList.add('active');
             sidebarOverlay.classList.add('active');
        });
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', () => {
             sidebar.classList.remove('active');
             sidebarOverlay.classList.remove('active');
        });
        if (sidebarToggleDesktop) sidebarToggleDesktop.addEventListener('click', () => {
             sidebar.classList.toggle('mini');
             mainContent.classList.toggle('sidebar-mini');
             const state = sidebar.classList.contains('mini') ? 'mini' : 'full';
             localStorage.setItem('sidebarState', state);
        });

        window.addEventListener('resize', () => {
             const isMobile = window.innerWidth < mobileBreakpoint;
             const appContainer = document.querySelector('.app-container');

             if (isMobile) {
                 // Mobile behavior: Use fixed sidebar, adjust container width
                 sidebar.style.position = 'fixed';
                 appContainer.style.width = '100%';
                 appContainer.classList.remove('sidebar-mini'); // Ensure no mini class
                 if (sidebar.classList.contains('mini')) {
                     sidebar.classList.remove('mini');
                 }
                 // Show/Hide appropriate toggles
                 if(sidebarToggleDesktop) sidebarToggleDesktop.style.display = 'none';
                 if(mobileSidebarToggle) mobileSidebarToggle.style.display = 'flex';
             } else {
                 // Desktop behavior: Use sticky sidebar, adjust container width based on mini state
                 sidebar.style.position = 'sticky';
                  if (sidebar.classList.contains('active')) { // Close if slid out from mobile
                       sidebar.classList.remove('active');
                       sidebarOverlay.classList.remove('active');
                  }
                 appContainer.classList.toggle('sidebar-mini', sidebar.classList.contains('mini'));
                 appContainer.style.width = sidebar.classList.contains('mini')
                   ? `calc(100% - var(--sidebar-width-mini))`
                   : `calc(100% - var(--sidebar-width-full))`;
                 // Show/Hide appropriate toggles
                 if(sidebarToggleDesktop) sidebarToggleDesktop.style.display = 'flex';
                 if(mobileSidebarToggle) mobileSidebarToggle.style.display = 'none';
             }
        });

        // --- Admin Page Toggle Logic ---
        function showAdminPage() {
             publicPage.style.display = 'none'; adminPage.style.display = 'block'; addLinkForm.reset();

             const adminCrumb = document.getElementById('admin-crumb');

                 const newCrumb = document.createElement('li');
                 newCrumb.id = 'admin-crumb'; newCrumb.textContent = 'Add Link';

             adminPage.style.display = 'none'; publicPage.style.display = 'block';
             const adminCrumb = document.getElementById('admin-crumb');
             if (adminCrumb) adminCrumb.remove();
             // No need to fetch, snapshot listener handles updates. Just re-render.
             renderLinks(currentCategory);
        }
        if (addBtn) addBtn.addEventListener('click', showAdminPage);
        if (backToPublicBtn) backToPublicBtn.addEventListener('click', showPublicPage);

        // --- Modal Handling ---
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.add('active');

            const modal = document.getElementById(modalId);
            if (modal) modal.classList.remove('active');
        }
        document.querySelectorAll('.modal-close-btn').forEach(btn => btn.addEventListener('click', () => closeModal(btn.dataset.target)));
        document.querySelectorAll('.modal-overlay').forEach(overlay => overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(overlay.id); }));

        // --- Customize Categories Button ---
        if (customizeCategoriesBtn) customizeCategoriesBtn.addEventListener('click', () => { populateCategoryTable(); openModal('category-list-modal'); });

        // --- Populate Category Management Table ---
        function populateCategoryTable() {
            if (!categoryTableBody) return;
            categoryTableBody.innerHTML = ''; // Clear existing rows
            allCategoriesData.forEach(cat => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${cat.name}</td>
                    <td class="icon-preview"><span class="iconify" data-icon="${cat.icon}" data-fw="true" style="color: ${cat.color};"></span></td>
                    <td><div class="color-swatch" style="background-color: ${cat.color};"></div></td>
                    <td class="actions">
                        <button class="edit-cat-btn" data-id="${cat.id}" title="Edit"><span class="iconify" data-icon="mdi:pencil"></span></button>
                        <button class="delete-cat-btn" data-id="${cat.id}" data-name="${cat.name}" title="Delete"><span class="iconify" data-icon="mdi:delete"></span></button>
                    </td>
                `;
                // Add event listeners for edit/delete
                row.querySelector('.edit-cat-btn').addEventListener('click', () => openCategoryEditModal(cat.id));
                row.querySelector('.delete-cat-btn').addEventListener('click', () => deleteCategory(cat.id, cat.name));
                categoryTableBody.appendChild(row);
            });
        }

        // --- Open Add/Edit Category Modal ---
        function openCategoryEditModal(categoryId = null) {
            categoryEditForm.reset();
            categoryEditColor.value = '#10b981'; // Reset color picker

            if (categoryId) {
                // Edit mode
                const category = allCategoriesData.find(cat => cat.id === categoryId);
                if (category) {
                    categoryEditTitle.textContent = 'Edit Category';
                    categoryEditId.value = category.id;
                    categoryEditOriginalName.value = category.name;
                    categoryEditName.value = category.name;
                    categoryEditIcon.value = category.icon;
                    categoryEditColor.value = category.color;
                }
            } else {
                // Add mode
                categoryEditTitle.textContent = 'Add Category';
                categoryEditId.value = '';
                categoryEditOriginalName.value = '';
            }
            closeModal('category-list-modal'); // Close list modal
            openModal('category-edit-modal'); // Open edit modal
        }
        if (addNewCategoryBtn) addNewCategoryBtn.addEventListener('click', () => openCategoryEditModal(null));

        // --- Batch update links if category name changes ---
        async function updateLinksOnCategoryRename(oldName, newName) {
            if (oldName === newName) return;
            if (!db) {
                console.error("Firestore db instance is not available.");
                return;
            }
            console.log(`Batch updating links from category '${oldName}' to '${newName}'...`);
            const batch = writeBatch(db);
            const q = query(linksCollectionRef, where("category", "==", oldName));
            try {
                // Use getDocs for a one-time update operation
                const querySnapshot = await getDocs(q); 
                querySnapshot.forEach(doc => {
                    batch.update(doc.ref, { category: newName });
                });
                await batch.commit();
                console.log("Batch update successful.");
            } catch (error) {
                console.error("Error batch updating links:", error);
            }
        }

        // --- Batch update links to 'Uncategorized' if category is deleted ---
        async function updateLinksOnCategoryDelete(deletedCategoryName) {
            if (!db) {
                console.error("Firestore db instance is not available.");
                return;
            }
            console.log(`Batch updating links from deleted category '${deletedCategoryName}' to 'Uncategorized'...`);
            const batch = writeBatch(db);
            const q = query(linksCollectionRef, where("category", "==", deletedCategoryName));
            try {
                // Use getDocs for a one-time update operation
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach(doc => {
                    batch.update(doc.ref, { category: "Uncategorized" });
                });
                await batch.commit();
                console.log("Batch update to 'Uncategorized' successful.");
            } catch (error) {
                console.error("Error batch updating links:", error);
            }
        }

        // --- Save Category (Add or Edit) ---
        if (categoryEditForm) categoryEditForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!categoriesCollectionRef) {
                console.error("Categories collection reference is not set.");
                return;
            }
            categorySaveBtn.disabled = true;
            categorySaveBtn.textContent = 'Saving...';

            const categoryData = {
                name: categoryEditName.value.trim(),
                icon: categoryEditIcon.value.trim() || 'mdi:link', // Default Iconify icon
                color: categoryEditColor.value
            };
            const categoryId = categoryEditId.value;
            const oldName = categoryEditOriginalName.value;

            try {
                if (categoryId) {
                    // Update existing category
                    const categoryRef = doc(categoriesCollectionRef, categoryId);
                    await updateDoc(categoryRef, categoryData);
                    // Check if name changed and update links
                    if (oldName && oldName !== categoryData.name) {
                        await updateLinksOnCategoryRename(oldName, categoryData.name);
                    }
                } else {
                    // Add new category
                    await addDoc(categoriesCollectionRef, categoryData);
                }
                closeModal('category-edit-modal');
                // The onSnapshot listener will repopulate the table, so just open the list modal
                openModal('category-list-modal'); 
            } catch (error) {
                console.error("Error saving category: ", error);
            } finally {
                categorySaveBtn.disabled = false;
                categorySaveBtn.textContent = 'Save Category';
            }
        });

        // --- Delete Category ---
        async function deleteCategory(categoryId, categoryName) {
            if (!categoriesCollectionRef) {
                console.error("Categories collection reference is not set.");
                return;
            }
            // NOTE: This is a destructive action. A custom confirmation modal would be ideal.
            // For now, it deletes directly as per "no confirm()" rule.
            try {
                await deleteDoc(doc(categoriesCollectionRef, categoryId));
                // Now update links that belonged to this category
                await updateLinksOnCategoryDelete(categoryName);
                // The onSnapshot listener will repopulate the table
            } catch (error) {
                console.error("Error deleting category: ", error);
            }
        }

        // --- Delete Link ---
        async function deleteLink(idToDelete) {
             if (!linksCollectionRef) {
                 console.error("Links collection reference is not set.");
                 return;
            }
            // NOTE: Also destructive. A custom confirmation modal would be ideal.
            try {
                await deleteDoc(doc(linksCollectionRef, idToDelete));
                // The onSnapshot listener will update the UI
            } catch (error) {
                console.error("Error deleting link: ", error);
            }
        }

        // --- Populate Categories (Sidebar & Admin Dropdown) ---
        function populateCategories() {
            // 1. Clear Sidebar (keeping "All Links")
            sidebarNav.innerHTML = `<li class="active"><a href="#" data-category="All"><span class="iconify" data-icon="mdi:view-grid" data-fw="true"></span><span>All Links</span></a></li>`;
            // 2. Clear Admin Dropdown
            linkCategorySelect.innerHTML = '<option value="Uncategorized">Uncategorized</option>';

            // 3. Sort and Populate
            const sortedCategories = [...allCategoriesData].sort((a, b) => a.name.localeCompare(b.name));
            
            sortedCategories.forEach(cat => {
                // Add to sidebar
                const li = document.createElement('li');
                li.innerHTML = `<a href="#" data-category="${cat.name}"><span class="iconify" data-icon="${cat.icon}" data-fw="true" style="color: ${cat.color};"></span><span>${cat.name}</span></a>`;
                sidebarNav.appendChild(li);

                // Add to admin dropdown
                const option = document.createElement('option');
                option.value = cat.name;
                option.textContent = cat.name;
                linkCategorySelect.appendChild(option);
            });

            // 4. Set active item based on currentCategory
            updateSidebarActiveState();
        }

        // --- Update Sidebar Active State ---
        function updateSidebarActiveState() {
            const links = sidebarNav.querySelectorAll('li');
            links.forEach(li => {
                const a = li.querySelector('a');
                if (a && a.dataset.category === currentCategory) {
                    li.classList.add('active');
                } else {
                    li.classList.remove('active');
                }
            });
        }
        
        // --- Update Breadcrumbs ---
        function updateBreadcrumbs(category) {
            breadcrumbList.innerHTML = '<li><a href="#">MyLinks</a></li>';
            if (category !== 'All') {
                const newCrumb = document.createElement('li');
                newCrumb.textContent = category;
                breadcrumbList.appendChild(newCrumb);
            }
        }

        // --- Sidebar Category Click Logic ---
        if (sidebarNav) sidebarNav.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (link && link.dataset.category) {
                e.preventDefault();
                const categoryName = link.dataset.category;
                currentCategory = categoryName;

                updateSidebarActiveState();
                updateBreadcrumbs(categoryName);
                renderLinks(currentCategory); // Render from local data
                
                // If on mobile, close sidebar after click
                if (window.innerWidth < mobileBreakpoint) {
                    sidebar.classList.remove('active');
                    sidebarOverlay.classList.remove('active');
                }
            }
        });

        // --- Create a single Link Card element ---
        function createLinkCard(link) {
            const defaultCat = { icon: 'mdi:link', color: '#718096' }; // Default Iconify icon
            const cat = allCategoriesData.find(c => c.name === link.category) || defaultCat;
            
            const card = document.createElement('div');
            card.className = 'link-card';
            card.dataset.id = link.id;
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-initial-circle">
                        <span class="iconify" data-icon="${cat.icon}" data-fw="true"></span>
                    </div>
                    <button class="delete-btn" title="Delete Link">
                        <span class="iconify" data-icon="mdi:delete" data-fw="true"></span>
                    </button>
                </div>
                <div class="card-content">
                    <div>
                        <h3 class="card-title"></h3>
                        <p class="card-subtitle"></p>
                    </div>
                    <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="view-btn">
                        <span class="iconify" data-icon="mdi:open-in-new"></span> View Link
                    </a>
                </div>
            `;
            
            // Set styles and listeners
            card.querySelector('.card-initial-circle').style.backgroundColor = cat.color;
            // Sanitize title and subtitle to prevent XSS
            card.querySelector('.card-title').textContent = link.name;
            card.querySelector('.card-subtitle').textContent = link.url;
            
            card.querySelector('.delete-btn').addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation(); // Prevent link navigation
                deleteLink(link.id);
            });

            return card;
        }

        // --- Render Links from local data ---
        function renderLinks(categoryFilter = 'All') {
            currentCategory = categoryFilter;
            let filteredLinks = allLinksData;

            if (categoryFilter !== 'All') {
                filteredLinks = allLinksData.filter(link => link.category === categoryFilter);
            }

            linksContainer.innerHTML = ''; // Clear container

            if (filteredLinks.length > 0) {
                filteredLinks
                    .sort((a, b) => a.name.localeCompare(b.name)) // Sort links alphabetically
                    .forEach(link => {
                        linksContainer.appendChild(createLinkCard(link));
                    });
            } else {
                linksContainer.innerHTML = `<p class="no-search-results">No links found in this category.</p>`;
            }

            // Apply search filter after rendering
            filterLinksBySearch();
        }


        // --- Search Bar Logic ---
        function filterLinksBySearch() {
            const searchTerm = searchInput.value.toLowerCase();
            const cards = linksContainer.querySelectorAll('.link-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const title = card.querySelector('.card-title').textContent.toLowerCase();
                const subtitle = card.querySelector('.card-subtitle').textContent.toLowerCase();
                const isVisible = title.includes(searchTerm) || subtitle.includes(searchTerm);
                
                card.classList.toggle('hidden', !isVisible);
                if (isVisible) visibleCount++;
            });

            // Show 'no results' message if search clears everything
            const noResultsMsg = linksContainer.querySelector('.no-search-results');
            if (visibleCount === 0 && cards.length > 0) {
                if (noResultsMsg) {
                    noResultsMsg.textContent = 'No links match your search.';
                    noResultsMsg.style.display = 'block';
                } else {
                    linksContainer.innerHTML = `<p class="no-search-results">No links match your search.</p>`;
                }
            } else if (visibleCount > 0 && noResultsMsg) {
                noResultsMsg.style.display = 'none'; // Hide if there are results
            } else if (visibleCount === 0 && cards.length === 0) {
                 // This means the category was empty to begin with
                 linksContainer.innerHTML = `<p class="no-search-results">No links found in this category.</p>`;
            }
        }
        if (searchInput) searchInput.addEventListener('input', filterLinksBySearch);

        // --- Setup Firestore Listeners ---
        function setupFirestoreListeners() {
            if (!userId || !db) return;

            // Define collection paths
            linksCollectionRef = collection(db, 'artifacts', appId, 'users', userId, 'links');
            categoriesCollectionRef = collection(db, 'artifacts', appId, 'users',userId, 'categories');

            // --- Categories Listener ---
            if (categoriesUnsubscribe) categoriesUnsubscribe(); // Unsubscribe from old listener
            categoriesUnsubscribe = onSnapshot(categoriesCollectionRef, (snapshot) => {
                console.log("Categories snapshot received");
                allCategoriesData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                populateCategories(); // Update sidebar and dropdown
                renderLinks(currentCategory); // Re-render links to apply new colors/icons
                
                // Only update table if modal is open, to avoid layout shifts
                if (categoryListModal.classList.contains('active')) {
                   populateCategoryTable(); // Update category management table
                }
            }, (error) => {
                console.error("Error fetching categories:", error);
            });

            // --- Links Listener ---
            if (linksUnsubscribe) linksUnsubscribe(); // Unsubscribe from old listener
            linksUnsubscribe = onSnapshot(linksCollectionRef, (snapshot) => {
                console.log("Links snapshot received");
                allLinksData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                renderLinks(currentCategory); // Re-render links
            }, (error) => {
                console.error("Error fetching links:", error);
                linksContainer.innerHTML = `<p class="no-search-results">Error loading links: ${error.message}</p>`;
            });
        }

        // --- Add Link Handler ---
        if (addLinkForm) addLinkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
             if (!linksCollectionRef) {
                 console.error("Links collection reference is not set.");
                 return;
            }
            submitBtn.disabled = true;
            submitBtn.textContent = 'Adding...';

            try {
                await addDoc(linksCollectionRef, {
                    name: linkName.value,
                    category: linkCategorySelect.value,
                    url: linkUrl.value,
                    createdAt: new Date() // Add timestamp
                });
                addLinkForm.reset();
                showPublicPage(); // Go back to the main page
            } catch (error) {
                console.error("Error adding link: ", error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Link';
            }
        });

        // --- Authentication then Data Fetch ---
        async function initializeAndFetch() {
            if (!app || !auth || !db) {
                 console.error("Firebase is not initialized.");
                 linksContainer.innerHTML = `<p class='no-search-results'>Error: Service connection failed.</p>`;
                 return;
            }
            try {
                const savedTheme = localStorage.getItem('theme') || 'light'; applyTheme(savedTheme === 'dark');

                // Initial UI state - For original structure
                 const isMobile = window.innerWidth < mobileBreakpoint;
                 const savedSidebarState = localStorage.getItem('sidebarState') || 'full';
                 const appContainer = document.querySelector('.app-container');

                  if (isMobile) {
                       sidebar.style.position = 'fixed'; // Start fixed on mobile
                       appContainer.style.width = '100%';
                       appContainer.classList.remove('sidebar-mini');
                       sidebar.classList.remove('mini', 'active'); // Ensure closed and not mini
                       sidebarOverlay.classList.remove('active');
                  } else {
                       sidebar.style.position = 'sticky'; // Start sticky on desktop
                       const isMini = savedSidebarState === 'mini';
                       sidebar.classList.toggle('mini', isMini);
                       appContainer.classList.toggle('sidebar-mini', isMini);
                       appContainer.style.width = isMini
                           ? `calc(100% - var(--sidebar-width-mini))`
                           : `calc(100% - var(--sidebar-width-full))`;
                  }
                 // Apply initial display none/flex based on breakpoint for toggles
                 if(sidebarToggleDesktop) sidebarToggleDesktop.style.display = isMobile ? 'none' : 'flex';
                 if(mobileSidebarToggle) mobileSidebarToggle.style.display = isMobile ? 'flex' : 'none';


                // Firebase Auth
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { await signInWithCustomToken(auth, __initial_auth_token); console.log("Signed in with custom token."); }
                else { await signInAnonymously(auth); console.log("Signed in anonymously."); }

                // Get User ID and Setup Listeners
                userId = auth.currentUser?.uid;
                if (!userId) { userId = crypto.randomUUID(); console.warn("Using random UUID for anonymous user."); }
                console.log("User ID:", userId);
                setupFirestoreListeners();

            } catch (error) { console.error("Error during initialization or auth: ", error); linksContainer.innerHTML = `<p class='no-search-results'>Error during startup: ${error.message}.</p>`; }
        }

        // --- Initial Load ---
        initializeAndFetch();
    </script>
</body>
</html>
