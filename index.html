<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Dashboard</title>
    <!-- Font Awesome for icons --><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Removed Inter Font Link -->

    <style>
        /* Import Fontshare Fonts (Satoshi & Nippo) */
        @import url('https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&f[]=nippo@700,500,400&display=swap');

        /* Modernize Dashboard Theme Colors & Variables */
        :root {
            /* Fonts */
            --font-main: 'Satoshi', sans-serif; /* Changed to Satoshi */
            --font-heading: 'Nippo', sans-serif; /* Changed to Nippo */

            /* Light Theme */
            --light-bg-body: #F8F9FB;
            --light-bg-card: #FFFFFF;
            --light-bg-sidebar: #FFFFFF;
            --light-bg-header: #FFFFFF;
            --light-bg-modal: #FFFFFF; /* Added for modals */
            --light-text-primary: #2A3142;
            --light-text-secondary: #7C8696;
            --light-border: #E5E7EB;
            --light-shadow: rgba(0, 0, 0, 0.05);

            /* Dark Theme */
            --dark-bg-body: #111827; /* Main background, slightly lighter than components */
            --dark-bg-card: #1f2937; /* Card, sidebar, header background */
            --dark-bg-sidebar: #1f2937;
            --dark-bg-header: #1f2937;
            --dark-bg-modal: #1f2937; /* Added for modals */
            --dark-text-primary: #F8F9FB;
            --dark-text-secondary: #9CA3AF;
            --dark-border: #374151;
            --dark-shadow: rgba(0, 0, 0, 0.3);

            /* Accent Colors from Modernize Dashboard Cards */
            --accent-purple: #8B5CF6; /* Employees */
            --accent-orange: #FBBF24; /* Clients */
            --accent-teal: #2DD4BF; /* Projects */
            --accent-red: #EF4444;   /* Events */
            --accent-green: #10B981; /* Payroll */
            --accent-blue: #60A5FA;  /* Reports */

            /* Sidebar Sizes */
            --sidebar-width-full: 280px;
            --sidebar-width-mini: 80px; /* Adjusted for cleaner icon-only view */
        }

        /* --- Base Layout & Typography --- */
        html {
            box-sizing: border-box;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            font-family: var(--font-main); /* Apply Satoshi */
            margin: 0;
            background-color: var(--light-bg-body);
            color: var(--light-text-primary);
            min-height: 100vh;
            display: flex; /* Sidebar layout */
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1, h2, h3, h4, h5, h6 {
            margin: 0;
            color: var(--light-text-primary);
            font-family: var(--font-heading); /* Apply Nippo */
        }
        .sidebar-logo-text { /* Target only the text part of the logo */
             font-family: var(--font-heading); /* Nippo for logo text */
        }

        ::placeholder {
            color: var(--light-text-secondary);
            opacity: 0.7;
        }

        /* --- Dark Theme Overrides --- */
        body.dark-theme {
            background-color: var(--dark-bg-body);
            color: var(--dark-text-primary);
        }
        body.dark-theme h1, body.dark-theme h2, body.dark-theme h3,
        body.dark-theme h4, body.dark-theme h5, body.dark-theme h6 {
            color: var(--dark-text-primary);
        }
        body.dark-theme ::placeholder {
            color: var(--dark-text-secondary);
        }
        body.dark-theme .app-sidebar {
            background-color: var(--dark-bg-sidebar);
            border-right-color: var(--dark-border);
        }
        body.dark-theme .sidebar-logo {
            color: var(--dark-text-primary);
        }
        body.dark-theme .sidebar-nav a {
            color: var(--dark-text-secondary);
        }
        body.dark-theme .sidebar-nav a:hover,
        body.dark-theme .sidebar-nav li.active a {
            background-color: rgba(255, 255, 255, 0.08); /* Lighter hover/active for dark mode */
            color: var(--dark-text-primary);
        }
        body.dark-theme .sidebar-nav li.active a {
             box-shadow: none; /* Modernize doesn't use strong shadows on sidebar active */
             background-image: none; /* Ensure gradient removed */
        }
        body.dark-theme .sidebar-toggle-desktop { /* Adjusted */
            color: var(--dark-text-secondary);
        }
        body.dark-theme .app-header {
            background-color: var(--dark-bg-header);
            border-bottom-color: var(--dark-border);
        }
        body.dark-theme .search-bar input {
            background-color: #2A3142; /* Slightly darker than header for input */
            border-color: #374151;
            color: var(--dark-text-primary);
        }
        body.dark-theme .search-bar input:focus {
            border-color: var(--accent-blue); /* Consistent focus color */
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }
        body.dark-theme .search-bar .search-icon {
            color: var(--dark-text-secondary);
        }
        body.dark-theme .header-icon-button {
            background-color: #2A3142;
            color: var(--dark-text-primary);
        }
        body.dark-theme .header-icon-button:hover {
            background-color: #374151;
        }
        body.dark-theme .app-breadcrumbs {
            background-color: #1a222f; /* Slightly lighter than body for contrast */
            border-bottom-color: var(--dark-border);
        }
        body.dark-theme .app-breadcrumbs li {
            color: var(--dark-text-secondary);
        }
        body.dark-theme .app-breadcrumbs a {
            color: var(--dark-text-primary);
        }
        body.dark-theme .dashboard-grid .link-card {
            background-color: var(--dark-bg-card);
            border-color: var(--dark-border);
            box-shadow: 0 4px 12px var(--dark-shadow);
        }
        body.dark-theme .link-card .card-content {
            background-color: var(--dark-bg-card); /* Keep content background same as card */
        }
        body.dark-theme .link-card .card-title {
            color: var(--dark-text-primary);
        }
        body.dark-theme .link-card .card-subtitle {
            color: var(--dark-text-secondary);
        }
        body.dark-theme .link-card .delete-btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--dark-text-primary);
        }
        body.dark-theme .link-card .delete-btn:hover {
            background-color: var(--accent-red);
            color: #FFFFFF;
        }
        body.dark-theme .admin-form-container {
            background-color: var(--dark-bg-card);
            border-color: var(--dark-border);
            box-shadow: 0 4px 12px var(--dark-shadow);
        }
        body.dark-theme .admin-form-container h2 {
            color: var(--dark-text-primary);
        }
        body.dark-theme .admin-form-container label {
            color: var(--dark-text-secondary);
        }
        body.dark-theme .admin-form-container input,
        body.dark-theme .admin-form-container select,
        body.dark-theme input[type="color"] { /* Style color picker in dark mode */
            background-color: #2A3142;
            border-color: #374151;
            color: var(--dark-text-primary);
        }
        body.dark-theme input[type="color"]::-webkit-color-swatch-wrapper {
             padding: 0; /* Adjust padding if needed */
        }
        body.dark-theme input[type="color"]::-webkit-color-swatch {
            border: none; /* Remove border in dark mode */
            border-radius: 4px;
        }
        body.dark-theme .admin-form-container ::placeholder {
            color: var(--dark-text-secondary);
        }
        body.dark-theme .app-footer {
            color: var(--dark-text-secondary);
            border-top-color: var(--dark-border);
        }
        body.dark-theme .modal {
            background-color: var(--dark-bg-modal);
            border: 1px solid var(--dark-border);
        }
        body.dark-theme .modal h2 {
            color: var(--dark-text-primary);
        }
        body.dark-theme .modal label {
            color: var(--dark-text-secondary);
        }
        body.dark-theme .modal input, body.dark-theme .modal select {
            background-color: #2A3142;
            border-color: #374151;
            color: var(--dark-text-primary);
        }
        body.dark-theme .modal table {
            border-color: var(--dark-border);
        }
        body.dark-theme .modal th, body.dark-theme .modal td {
            border-color: var(--dark-border);
        }
        body.dark-theme .modal th {
            background-color: #2A3142;
        }
        body.dark-theme .modal .btn-secondary {
            background-color: #374151;
            color: var(--dark-text-primary);
            border-color: #4b5563;
        }
        body.dark-theme .modal .btn-secondary:hover {
            background-color: #4b5563;
        }


        /* --- App Container & Main Content --- */
        .app-container { flex-grow: 1; display: flex; flex-direction: column; min-height: 100vh; width: calc(100% - var(--sidebar-width-full)); transition: width 0.3s ease; }
        .app-container.sidebar-mini { width: calc(100% - var(--sidebar-width-mini)); }
        .app-main-content { flex-grow: 1; padding: 20px; padding-bottom: 40px; max-width: 100%; }
        .container { max-width: 1200px; margin: 0 auto; }


        /* --- Sidebar (app-sidebar) --- */
        .app-sidebar { width: var(--sidebar-width-full); background-color: var(--light-bg-sidebar); border-right: 1px solid var(--light-border); flex-shrink: 0; height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; transition: width 0.3s ease, background-color 0.3s ease, border-color 0.3s ease; box-shadow: 0 2px 10px var(--light-shadow); }
        .sidebar-logo { font-size: 1.5rem; font-weight: 700; color: var(--light-text-primary); padding: 24px 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; overflow: hidden; position: relative; }
        .sidebar-logo-content { display: flex; align-items: center; gap: 10px; overflow: hidden; flex-grow: 1; }
        .sidebar-logo .fa-layer-group { color: var(--accent-blue); font-size: 1.8rem; }
        .sidebar-logo-text { transition: opacity 0.2s ease, width 0.2s ease; white-space: nowrap; }
        .sidebar-toggle-desktop { background: none; border: none; color: var(--light-text-secondary); padding: 5px; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; width: 36px; height: 36px; flex-shrink: 0; transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease; }
        .sidebar-toggle-desktop .fa-fw { transition: transform 0.3s ease; } /* Add transition for icon */
        .sidebar-toggle-desktop:hover { color: var(--light-text-primary); background-color: #F0F2F5; }
        body.dark-theme .sidebar-toggle-desktop { color: var(--dark-text-secondary); }
        body.dark-theme .sidebar-toggle-desktop:hover { color: var(--dark-text-primary); background-color: rgba(255, 255, 255, 0.08); }
        .app-sidebar.mini .sidebar-toggle-desktop .fa-fw { transform: rotate(180deg); } /* Rotate icon when mini */
        .sidebar-nav-container { padding: 0 20px; overflow-y: auto; flex-grow: 1; padding-bottom: 20px; }
        .sidebar-nav-title { font-size: 0.75rem; font-weight: 600; color: var(--light-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 10px; margin-top: 15px; white-space: nowrap; overflow: hidden; transition: opacity 0.2s ease; }
        .sidebar-nav { list-style: none; padding: 0; margin: 0; }
        .sidebar-nav li a { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 500; color: var(--light-text-secondary); transition: background 0.2s ease, color 0.2s ease; white-space: nowrap; overflow: hidden; font-size: 0.9rem; }
        .sidebar-nav li a:hover { background-color: #F0F2F5; color: var(--light-text-primary); }
        .sidebar-nav li.active a { background: linear-gradient(to right, #60A5FA, #3B82F6); color: #FFFFFF; box-shadow: 0 4px 10px rgba(96, 165, 250, 0.3); }
        .sidebar-nav li a .fa-fw { width: 1.25em; text-align: center; flex-shrink: 0; font-size: 1.1rem; }
        .sidebar-nav li.active a .fa-fw { color: #FFFFFF; }
        .app-sidebar.mini { width: var(--sidebar-width-mini); }
        .app-sidebar.mini .sidebar-logo { padding-left: 0; padding-right: 0; justify-content: center; }
        .app-sidebar.mini .sidebar-logo-content { width: 0; opacity: 0; visibility: hidden; }
        .app-sidebar.mini .sidebar-logo-text { opacity: 0; width: 0; visibility: hidden; }
        .app-sidebar.mini .sidebar-nav-container { padding: 0 10px; }
        .app-sidebar.mini .sidebar-nav-title { opacity: 0; height: 0; padding: 0; margin: 0; }
        .app-sidebar.mini .sidebar-nav li a { justify-content: center; }
        .app-sidebar.mini .sidebar-nav li a span { opacity: 0; width: 0; visibility: hidden; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 998; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0s 0.3s; }
        .sidebar-overlay.active { opacity: 1; visibility: visible; transition: opacity 0.3s ease, visibility 0s 0s; }


        /* --- App Header (Navbar) --- */
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: var(--light-bg-header); border-bottom: 1px solid var(--light-border); flex-shrink: 0; box-shadow: 0 2px 5px var(--light-shadow); transition: background-color 0.3s ease, border-color 0.3s ease, padding 0.3s ease; }
        .header-left { display: flex; align-items: center; gap: 20px; flex-grow: 1; }
        .header-controls { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
        .mobile-sidebar-toggle { background: none; border: none; color: var(--light-text-secondary); font-size: 1.3rem; cursor: pointer; padding: 8px; border-radius: 50%; transition: color 0.3s ease, background-color 0.3s ease, transform 0.1s ease; display: none; }
        .mobile-sidebar-toggle:hover { background-color: #F0F2F5; color: var(--light-text-primary); }
        body.dark-theme .mobile-sidebar-toggle { color: var(--dark-text-secondary); }
        body.dark-theme .mobile-sidebar-toggle:hover { background-color: #374151; color: var(--dark-text-primary); }
        .search-bar { position: relative; width: 100%; max-width: 350px; } /* Adjusted max-width */
        .search-bar .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--light-text-secondary); }
        .search-bar input { width: 100%; padding: 10px 15px 10px 40px; background-color: #F0F2F5; border: 1px solid var(--light-border); border-radius: 8px; color: var(--light-text-primary); font-family: var(--font-main); font-size: 0.9rem; transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s; }
        .search-bar input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2); }
        .header-icon-button { background-color: #F0F2F5; color: var(--light-text-secondary); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease; }
        .header-icon-button:hover { background-color: #E5E7EB; color: var(--light-text-primary); }


        /* --- App Breadcrumbs --- */
        .app-breadcrumbs { padding: 12px 30px; background-color: #F0F2F5; border-bottom: 1px solid var(--light-border); flex-shrink: 0; transition: background-color 0.3s ease, border-color 0.3s ease; font-size: 0.9rem; }
        .app-breadcrumbs ul { margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 8px; }
        .app-breadcrumbs li { color: var(--light-text-secondary); }
        .app-breadcrumbs li:not(:last-child)::after { content: '/'; margin-left: 8px; color: var(--light-text-secondary); }
        .app-breadcrumbs a { color: var(--light-text-primary); text-decoration: none; font-weight: 500; }
        .app-breadcrumbs a:hover { text-decoration: underline; }

        /* --- Dashboard Grid & Link Cards --- */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .dashboard-grid .no-search-results { grid-column: 1 / -1; text-align: center; color: var(--light-text-secondary); margin-top: 40px; font-size: 1.1rem; }
        .link-card { background-color: var(--light-bg-card); border-radius: 12px; box-shadow: 0 4px 12px var(--light-shadow); position: relative; /* Remove fixed height */ min-height: 180px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--light-border); transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease; }
        .link-card.hidden { display: none; }
        .link-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px var(--light-shadow); }
        .card-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background-size: cover; background-position: center; border-top-left-radius: 12px; border-top-right-radius: 12px; min-height: 80px; position: relative; z-index: 1; }
        .card-initial-circle { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background-color: rgba(255, 255, 255, 0.3); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); color: #FFFFFF; font-size: 1.5rem; font-weight: 600; flex-shrink: 0; font-family: var(--font-heading); text-transform: uppercase; }
        .delete-btn { background-color: rgba(0, 0, 0, 0.2); border: none; color: #FFFFFF; font-size: 1rem; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s, color 0.2s, transform 0.1s ease; z-index: 10; }
        .delete-btn:hover { background-color: var(--accent-red); color: #FFFFFF; }
        .card-content { flex-grow: 1; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; background-color: var(--light-bg-card); border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; border-top: 1px solid var(--light-border); transition: background-color 0.2s ease, border-color 0.2s ease; }
        body.dark-theme .card-content { border-top-color: var(--dark-border); }
        .card-title { font-size: 1rem; font-weight: 600; color: var(--light-text-primary); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-subtitle { font-size: 0.85rem; color: var(--light-text-secondary); margin-bottom: 12px; /* Increased bottom margin */ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .view-btn { width: 100%; padding: 8px 15px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; text-decoration: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: #FFFFFF; background: linear-gradient(to right, #60A5FA, #3B82F6); border: none; transition: background 0.3s ease, box-shadow 0.2s ease, transform 0.1s ease; margin-top: auto; /* Push button to bottom */ }
        .view-btn:hover { background: linear-gradient(to right, #7dd3fc, #60A5FA); box-shadow: 0 4px 12px rgba(96, 165, 250, 0.4); }
        
        /* --- Admin Form Page --- */
        .admin-form-container { max-width: 600px; margin: 40px auto; padding: 30px; background-color: var(--light-bg-card); border-radius: 8px; box-shadow: 0 4px 12px var(--light-shadow); border: 1px solid var(--light-border); transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease; }
        .admin-form-container h2 { font-family: var(--font-main); font-weight: 700; text-align: center; margin-top: 0; margin-bottom: 30px; color: var(--light-text-primary); }
        .admin-form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; } /* New header for title and customize button */
        .customize-btn { background-color: #F0F2F5; color: var(--light-text-secondary); border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: background-color 0.2s, color 0.2s, transform 0.1s ease; }
        .customize-btn:hover { background-color: #E5E7EB; color: var(--light-text-primary); }
        body.dark-theme .customize-btn { background-color: #2A3142; color: var(--dark-text-secondary); }
        body.dark-theme .customize-btn:hover { background-color: #374151; color: var(--dark-text-primary); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--light-text-secondary); font-size: 0.9rem; }
        /* Style for the color picker input */
        .form-group input[type="color"] { padding: 2px; height: 44px; cursor: pointer; border-radius: 8px; background-color: #F8F9FB; border: 1px solid var(--light-border); width: 100%; box-sizing: border-box; }
        .form-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 4px; }
        .form-group input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(0,0,0,0.1); border-radius: 4px; }
        body.dark-theme .form-group input[type="color"] { background-color: #2A3142; border-color: #374151; }
         body.dark-theme .form-group input[type="color"]::-webkit-color-swatch { border: none; }

        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--light-border); background-color: #F8F9FB; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; font-family: var(--font-main); color: var(--light-text-primary); transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease; }
        .form-group input:focus, .form-group select:focus, .form-group input[type="color"]:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2); }
        #link-category-new, #link-category-icon-new { display: none; margin-top: 10px; }
        .admin-form-container button[type="submit"] { width: 100%; padding: 12px; font-size: 1.1rem; font-weight: 600; background: linear-gradient(to right, #60A5FA, #3B82F6); color: white; border: none; border-radius: 8px; cursor: pointer; transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.1s ease; margin-top: 20px; }
        .admin-form-container button[type="submit"]:hover { background: linear-gradient(to right, #7dd3fc, #60A5FA); box-shadow: 0 4px 15px rgba(96, 165, 250, 0.4); }
        
        /* --- Footer --- */
        .app-footer { text-align: center; padding: 20px 30px; margin-top: auto; color: var(--light-text-secondary); font-size: 0.85rem; border-top: 1px solid var(--light-border); transition: color 0.3s ease, border-color 0.3s ease; flex-shrink: 0; }

        /* --- Modals --- */
        .modal-overlay {
            visibility: hidden;
            opacity: 0;
            position: fixed; 
            inset: 0; 
            background-color: rgba(0,0,0,0.6); 
            backdrop-filter: blur(5px); 
            -webkit-backdrop-filter: blur(5px); 
            z-index: 1000; 
            display: flex; /* Keep flex for centering */
            justify-content: center; 
            align-items: center; 
            transition: visibility 0s 0.2s, opacity 0.2s ease; /* Delay hiding */
        }
        .modal-overlay.active { 
            visibility: visible;
            opacity: 1;
            transition: visibility 0s 0s, opacity 0.2s ease;
        }
        .modal { 
            background-color: var(--light-bg-modal); 
            border-radius: 12px; 
            padding: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 90%; 
            max-width: 600px; /* Default for category list */ 
            border: 1px solid var(--light-border); 
            transform: scale(0.95);
            opacity: 0;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .modal-overlay.active .modal {
            transform: scale(1);
            opacity: 1;
        }
        .modal-small { max-width: 400px; } /* For add/edit form */
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--light-border); padding-bottom: 15px; }
        .modal-header h2 { font-size: 1.25rem; font-weight: 600; }
        .modal-close-btn { background: none; border: none; font-size: 1.5rem; color: var(--light-text-secondary); cursor: pointer; padding: 5px; line-height: 1; transition: color 0.2s ease, transform 0.1s ease; }
        .modal-close-btn:hover { color: var(--light-text-primary); }
        body.dark-theme .modal-close-btn { color: var(--dark-text-secondary); }
        body.dark-theme .modal-close-btn:hover { color: var(--dark-text-primary); }
        .modal-content { max-height: 60vh; overflow-y: auto; }
        .modal-actions { margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--light-border); padding-top: 20px; }
        .modal button { padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: background 0.2s, color 0.2s, transform 0.1s ease, border-color 0.2s; border: 1px solid transparent; }
        .modal .btn-primary { background: linear-gradient(to right, #60A5FA, #3B82F6); color: #fff; border: none; }
        .modal .btn-primary:hover { background: linear-gradient(to right, #7dd3fc, #60A5FA); }
        .modal .btn-secondary { background-color: #F0F2F5; color: var(--light-text-primary); border-color: var(--light-border); }
        .modal .btn-secondary:hover { background-color: #E5E7EB; }
        .modal .btn-danger { background-color: var(--accent-red); color: #fff; }
        .modal .btn-danger:hover { background-color: #D93737; }
        body.dark-theme .modal .btn-secondary { background-color: #374151; color: var(--dark-text-primary); border-color: #4b5563; }
        body.dark-theme .modal .btn-secondary:hover { background-color: #4b5563; }
        .modal .form-group { margin-bottom: 15px; } /* Tighter spacing in modal forms */
        .modal .form-group label { margin-bottom: 6px; font-size: 0.85rem; }
        .modal .form-group input, .modal .form-group select { padding: 10px; font-size: 0.9rem; }
        .modal input[type="color"] { height: 40px; } /* Slightly smaller color picker */

        /* Category Table Styles */
        .category-table-wrapper { overflow-x: auto; }
        .category-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .category-table th, .category-table td { padding: 12px 15px; text-align: left; border: 1px solid var(--light-border); font-size: 0.9rem; }
        .category-table th { background-color: #F0F2F5; font-weight: 600; color: var(--light-text-secondary); }
        .category-table td { color: var(--light-text-primary); }
        .category-table .color-swatch { display: inline-block; width: 20px; height: 20px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); vertical-align: middle; margin-right: 8px; }
        .category-table .icon-preview { font-size: 1.1rem; width: 1.5em; text-align: center; display: inline-block; vertical-align: middle; margin-right: 8px;}
        .category-table .actions { display: flex; gap: 8px; }
        .category-table .actions button { background: none; border: none; padding: 5px; cursor: pointer; font-size: 1rem; color: var(--light-text-secondary); transition: color 0.2s ease, transform 0.1s ease; }
        .category-table .actions button:hover { color: var(--accent-blue); }
        .category-table .actions .delete-cat-btn:hover { color: var(--accent-red); }
        body.dark-theme .category-table .actions button { color: var(--dark-text-secondary); }

        /* --- Button Active State (Touch Feedback) --- */
        .header-icon-button:active,
        .sidebar-toggle-desktop:active,
        .mobile-sidebar-toggle:active,
        .view-btn:active,
        .admin-form-container button[type="submit"]:active,
        .modal button:active,
        .category-table .actions button:active,
        .customize-btn:active,
        .delete-btn:active,
        .modal-close-btn:active {
            transform: scale(0.96);
            transition-duration: 0.05s; /* Faster reaction for active state */
        }


        /* --- Mobile Responsive Adjustments --- */
        @media (max-width: 992px) { /* Tablet breakpoint */
            .app-sidebar { position: fixed; left: 0; top: 0; height: 100%; z-index: 1000; transform: translateX(-100%); transition: transform 0.3s ease-in-out; }
            .app-sidebar.active { transform: translateX(0); }
            /* sidebar-overlay styles updated above for smoother transition */
            .mobile-sidebar-toggle { display: block; }
            .app-container { width: 100%; }
            .app-container.sidebar-mini { width: 100%; } /* No change needed */
            .sidebar-toggle-desktop { display: none; }
            .app-header { padding: 15px 20px; gap: 15px; }
            .header-left { gap: 10px; flex-grow: 1; /* Allow left side to grow */ }
            .search-bar { width: auto; max-width: none; } /* Allow search to fill space */
            .header-controls { flex-shrink: 0; } /* Prevent controls shrinking */
            .app-breadcrumbs { padding: 12px 20px; }
            .dashboard-grid { padding: 15px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
            .link-card { min-height: 170px; } /* Use min-height */
            .card-header { min-height: 70px; padding: 12px; }
            .card-initial-circle { width: 45px; height: 45px; font-size: 1.3rem; }
            .delete-btn { width: 32px; height: 32px; font-size: 0.9rem; }
            .card-content { padding: 12px; }
            .card-title { font-size: 0.95rem; }
            .card-subtitle { font-size: 0.8rem; }
            .view-btn { font-size: 0.85rem; padding: 7px 12px; }
            .modal { width: 95%; max-width: 95%; } /* Make modals wider on mobile */
        }
        @media (max-width: 576px) { /* Smaller mobile screens */
            .app-header { 
                flex-wrap: wrap; 
                justify-content: space-between; /* Align items to ends */
                padding: 10px 15px; /* Reduced padding */
                gap: 10px; /* Reduced gap */
            }
            .header-left { 
                width: auto; /* Don't make it full width */
                justify-content: flex-start; /* Align toggle to start */
                margin-bottom: 0; /* Remove margin */
                flex-grow: 0; /* Don't let it grow excessively */
            }
             .header-controls { 
                width: auto; /* Don't make it full width */
                justify-content: flex-end; /* Align icons to end */
                gap: 8px; /* Further reduce gap */
            }
            .search-bar { 
                width: 100%; 
                order: 3; /* Put search bar last */
                margin-top: 10px; /* Space above search bar */
            }
           
            .app-main-content { padding: 10px; }
            .dashboard-grid { padding: 10px; gap: 15px; }
            .admin-form-container { margin: 20px 10px; padding: 20px; }
            .modal-header h2 { font-size: 1.1rem; }
            .modal { padding: 20px; }
            .modal-actions { flex-direction: column; gap: 8px; }
            .modal-actions button { width: 100%; }
            .category-table th, .category-table td { padding: 8px 10px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <!-- Category Management Modal -->
    <div class="modal-overlay" id="category-list-modal">

                 <button id="add-new-category-btn" class="btn-primary"><i class="fas fa-plus"></i> Add New Category</button>

    <!-- Add/Edit Category Modal -->
    <div class="modal-overlay" id="category-edit-modal">
        <div class="modal modal-small">
            <div class="modal-header">
                <h2 id="category-edit-title">Add Category</h2>
                <button class="modal-close-btn" data-target="category-edit-modal">&times;</button>
            </div>
            <form id="category-edit-form">
                <input type="hidden" id="category-edit-id"> <!-- For editing existing categories -->
                <input type="hidden" id="category-edit-original-name"> <!-- To track name changes -->
                <div class="modal-content">
                     <div class="form-group">
                        <label for="category-edit-name">Category Name</label>
                        <input type="text" id="category-edit-name" required>
                    </div>
                     <div class="form-group">
                        <label for="category-edit-icon">Icon Class (Font Awesome)</label>
                        <input type="text" id="category-edit-icon" placeholder="e.g., fas fa-book" required>

                     <div class="form-group">

                    <button type="button" class="btn-secondary modal-close-btn" data-target="category-edit-modal">Cancel</button>
                </div>

    <!-- Javascript (uses latest Firebase Modular SDK) -->
    <script type="module">
        // --- Firebase Imports ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, setLogLevel, updateDoc, writeBatch, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"; // Added updateDoc, writeBatch, query, where
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyBquWSZVVwJITsN_H943-Fx2Z9uf-V9JQQ",
            authDomain: "suuu-5293b.firebaseapp.com",
            projectId: "suuu-5293b",
            storageBucket: "suuu-5293b.appspot.com",
            messagingSenderId: "1004581080357",
            appId: "1:1004581080357:web:c84ebb279776ad171e1ecc",
            measurementId: "G-KSWY1KL4BS"
        };
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- Collections ---
        const linksCollectionRef = collection(db, "links");
        const categoriesCollectionRef = collection(db, "categories"); // Updated reference name

        try { setLogLevel('debug'); } catch (e) {}

        // --- DOM Elements ---
        const body = document.body;
        const sidebar = document.getElementById('sidebar');
        const sidebarNav = document.getElementById('sidebar-nav');
        const mobileSidebarToggle = document.getElementById('mobile-sidebar-toggle');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const sidebarToggleDesktop = document.getElementById('sidebar-toggle-desktop');
        const mainContent = document.getElementById('main-content');
        const publicPage = document.getElementById('public-page');
        const adminPage = document.getElementById('admin-page');
        const addBtn = document.getElementById('add-btn');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const fullscreenToggleBtn = document.getElementById('fullscreen-toggle');
        const linksContainer = document.getElementById('links-container');
        const addLinkForm = document.getElementById('add-link-form');
        const linkName = document.getElementById('link-name');
        const linkCategorySelect = document.getElementById('link-category-select');
        // Removed linkCategoryNew, linkCategoryIconNew
        const linkUrl = document.getElementById('link-url');
        // Removed linkColorInput
        const submitBtn = document.getElementById('submit-btn');
        const breadcrumbList = document.getElementById('breadcrumb-list');
        const searchInput = document.getElementById('search-input');
        const customizeCategoriesBtn = document.getElementById('customize-categories-btn');
        const categoryListModal = document.getElementById('category-list-modal');
        const categoryEditModal = document.getElementById('category-edit-modal');
        const categoryTableBody = document.querySelector('#category-table tbody');
        const addNewCategoryBtn = document.getElementById('add-new-category-btn');
        const categoryEditForm = document.getElementById('category-edit-form');
        const categoryEditTitle = document.getElementById('category-edit-title');
        const categoryEditId = document.getElementById('category-edit-id');
        const categoryEditOriginalName = document.getElementById('category-edit-original-name');
        const categoryEditName = document.getElementById('category-edit-name');
        const categoryEditIcon = document.getElementById('category-edit-icon');
        const categoryEditColor = document.getElementById('category-edit-color');
        const categorySaveBtn = document.getElementById('category-save-btn');

        let allLinksData = []; // Cache for links
        let allCategoriesData = []; // Cache for categories [{id, name, icon, color}]
        let currentCategory = 'All'; // State for active category

        // --- Theme Toggle Logic ---
        function applyTheme(isDark) {
            if (isDark) {
                body.classList.add('dark-theme');
                themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.remove('dark-theme');
                themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
                localStorage.setItem('theme', 'light');
            }
        }
        themeToggleBtn.addEventListener('click', () => {
            applyTheme(!body.classList.contains('dark-theme'));
        });
        
        // --- Fullscreen Toggle Logic ---
        fullscreenToggleBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });
        document.addEventListener('fullscreenchange', () => {
            const icon = document.fullscreenElement ? 'fa-compress' : 'fa-expand';
            fullscreenToggleBtn.innerHTML = `<i class="fas ${icon}"></i>`;
        });

        // --- Sidebar Toggle Logic (Mobile & Desktop) ---
        mobileSidebarToggle.addEventListener('click', () => {
            sidebar.classList.add('active');
            sidebarOverlay.classList.add('active');
        });
        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
        });
        sidebarToggleDesktop.addEventListener('click', () => {
            sidebar.classList.toggle('mini');
            mainContent.classList.toggle('sidebar-mini');
            const state = sidebar.classList.contains('mini') ? 'mini' : 'full';
            localStorage.setItem('sidebarState', state);
        });

        // --- Admin Page Toggle Logic ---
        function showAdminPage() {
            publicPage.style.display = 'none';
            adminPage.style.display = 'block';
            addLinkForm.reset(); // Clear the form
            // Update breadcrumbs only if not already present
            if (!document.getElementById('admin-crumb')) {
                const adminCrumb = document.createElement('li');
                adminCrumb.id = 'admin-crumb';
                adminCrumb.textContent = 'Add Link';
                breadcrumbList.appendChild(adminCrumb);
            }
        }
        
        function showPublicPage() {
            adminPage.style.display = 'none';
            publicPage.style.display = 'block';
            // Remove admin breadcrumb
            const adminCrumb = document.getElementById('admin-crumb');
            if (adminCrumb) {
                adminCrumb.remove();
            }
            // Refetch and display links for the currently selected category
            fetchAndDisplayLinks(currentCategory);
        }
        addBtn.addEventListener('click', showAdminPage);
        
        // --- Modal Handling ---
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('active');
            }
        }
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('active');
            }
        }
        document.querySelectorAll('.modal-close-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetModalId = btn.dataset.target;
                if (targetModalId) {
                    closeModal(targetModalId);
                }
            });
        });
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                // Close only if clicking the overlay itself, not the modal content
                if (e.target === overlay) {
                    closeModal(overlay.id);
                }
            });
        });

        // --- Customize Categories Button ---
        customizeCategoriesBtn.addEventListener('click', () => {
            populateCategoryTable();
            openModal('category-list-modal');
        });

        // --- Populate Category Management Table ---
        function populateCategoryTable() {
            categoryTableBody.innerHTML = ''; // Clear existing table
            if (allCategoriesData.length === 0) {
                categoryTableBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No categories found. Add one!</td></tr>';
                return;
            }
            allCategoriesData.forEach(cat => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${cat.name}</td>
                    <td><i class="${cat.icon} icon-preview"></i> ${cat.icon}</td>
                    <td><span class="color-swatch" style="background-color: ${cat.color};"></span> ${cat.color}</td>
                    <td class="actions">
                        <button class="edit-cat-btn" data-id="${cat.id}" title="Edit"><i class="fas fa-pen"></i></button>
                        <button class="delete-cat-btn" data-id="${cat.id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
                    </td>
                `;
                categoryTableBody.appendChild(row);
            });

            // Add event listeners for new buttons
            document.querySelectorAll('.edit-cat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    openCategoryEditModal(btn.dataset.id);
                });
            });
            document.querySelectorAll('.delete-cat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    deleteCategory(btn.dataset.id);
                });
            });
        }

        // --- Open Add/Edit Category Modal ---
        function openCategoryEditModal(categoryId = null) {
            categoryEditForm.reset();
            categoryEditColor.value = '#60A5FA'; // Reset color picker default
            if (categoryId) {
                // Editing existing category
                const category = allCategoriesData.find(c => c.id === categoryId);
                if (category) {
                    categoryEditTitle.textContent = 'Edit Category';
                    categoryEditId.value = category.id;
                    categoryEditOriginalName.value = category.name;
                    categoryEditName.value = category.name;
                    categoryEditIcon.value = category.icon;
                    categoryEditColor.value = category.color;
                }
            } else {
                // Adding new category
                categoryEditTitle.textContent = 'Add Category';
                categoryEditId.value = '';
                categoryEditOriginalName.value = '';
            }
            openModal('category-edit-modal');
        }
        addNewCategoryBtn.addEventListener('click', () => openCategoryEditModal());

        // --- Save Category (Add or Edit) ---
        categoryEditForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            categorySaveBtn.disabled = true;
            categorySaveBtn.textContent = 'Saving...';

            const categoryData = {
                name: categoryEditName.value.trim(), // Trim whitespace
                icon: categoryEditIcon.value.trim(),
                color: categoryEditColor.value,
            };
            const catId = categoryEditId.value;
            const originalName = categoryEditOriginalName.value;

             // Basic validation
            if (!categoryData.name || !categoryData.icon) {
                console.error("Category name and icon cannot be empty.");
                // Add user feedback here (e.g., show an error message in the modal)
                categorySaveBtn.disabled = false;
                categorySaveBtn.textContent = 'Save Category';
                return;
            }


            try {
                if (catId) {
                    // --- Edit Existing Category ---
                    const categoryRef = doc(db, "categories", catId);
                    await updateDoc(categoryRef, categoryData);

                    // If name changed, update all associated links
                    if (originalName && originalName !== categoryData.name) {
                        const linksQuery = query(linksCollectionRef, where("category", "==", originalName));
                        const linksSnapshot = await getDocs(linksQuery);
                        
                        if (!linksSnapshot.empty) {
                            const batch = writeBatch(db);
                            linksSnapshot.forEach(linkDoc => {
                                batch.update(linkDoc.ref, { category: categoryData.name });
                            });
                            await batch.commit();
                        }
                    }
                } else {
                    // --- Add New Category ---
                    await addDoc(categoriesCollectionRef, categoryData);
                }

                // Refresh everything
                await fetchAllData();
                populateCategories();
                populateCategoryTable();
                fetchAndDisplayLinks(currentCategory); // Refresh main links view
                closeModal('category-edit-modal');

            } catch (error) {
                console.error("Error saving category: ", error);
                // In a real app, show a user-friendly error message
            } finally {
                categorySaveBtn.disabled = false;
                categorySaveBtn.textContent = 'Save Category';
            }
        });

        // --- Delete Category ---
        async function deleteCategory(categoryId) {
            const category = allCategoriesData.find(c => c.id === categoryId);
            if (!category) return;
            
            // Use a simple confirm dialog (replace with a custom modal in a real app)
            // if (!confirm(`Are you sure you want to delete "${category.name}"? All links in this category will be moved to "General".`)) {
            //     return;
            // }
            
            // In a real app, you'd use a custom modal confirmation, not window.confirm.
            // For this example, we'll just proceed.
            
            console.log(`Deleting category: ${category.name}. Re-assigning links...`);

            try {
                // Find all links with this category and update them to "General" in a batch
                const linksQuery = query(linksCollectionRef, where("category", "==", category.name));
                const linksSnapshot = await getDocs(linksQuery);
                
                const batch = writeBatch(db);
                if (!linksSnapshot.empty) {
                    linksSnapshot.forEach(linkDoc => {
                        batch.update(linkDoc.ref, { category: "General" });
                    });
                }
                
                // Also delete the category doc itself
                const categoryRef = doc(db, "categories", categoryId);
                batch.delete(categoryRef);

                // Commit all changes
                await batch.commit();

                // Refresh UI
                await fetchAllData();
                populateCategories();
                populateCategoryTable(); // Repopulate table in list modal
                
                // If the deleted category was the active one, switch to 'All'
                if (currentCategory === category.name) {
                    currentCategory = 'All';
                    // Set 'All Links' as active in sidebar
                    document.querySelector('.sidebar-nav li.active')?.classList.remove('active');
                    document.querySelector('.sidebar-nav li a[data-category="All"]')?.parentElement.classList.add('active');
                }
                fetchAndDisplayLinks(currentCategory); // Refresh main links view

            } catch (error) {
                console.error("Error deleting category: ", error);
                // In a real app, show a user-friendly error message
            }
        }
        
        // --- Delete Link ---
        async function deleteLink(idToDelete) {
            // In a real app, use a custom modal confirmation
            // if (!confirm("Are you sure you want to delete this link?")) {
            //     return;
            // }

            try {
                await deleteDoc(doc(db, "links", idToDelete));
                // Remove the link from the local cache to avoid full refetch
                 allLinksData = allLinksData.filter(link => link.id !== idToDelete);
                // Update UI directly from cache
                fetchAndDisplayLinks(currentCategory);
                console.log(`Link ${idToDelete} deleted successfully.`);

            } catch (error) {
                console.error("Error deleting link: ", error);
            }
        }


        // --- Populate Categories (Sidebar & Admin Dropdown) ---
        function populateCategories() {
            // Clear existing categories (except "All Links")
            const existingCategories = sidebarNav.querySelectorAll('li:not(:first-child)');
            existingCategories.forEach(li => li.remove());
            
            linkCategorySelect.innerHTML = '<option value="General">General</option>'; // Default option

            // Sort categories alphabetically
            allCategoriesData.sort((a, b) => a.name.localeCompare(b.name));
            
            allCategoriesData.forEach(cat => {
                // Add to sidebar
                const li = document.createElement('li');
                li.innerHTML = `<a href="#" data-category="${cat.name}">
                    <i class="${cat.icon} fa-fw"></i> <span>${cat.name}</span>
                </a>`;
                 // Set active class if it matches currentCategory
                if (cat.name === currentCategory) {
                    // Remove active from 'All Links' if necessary
                     document.querySelector('.sidebar-nav li.active')?.classList.remove('active');
                    li.classList.add('active');
                }
                sidebarNav.appendChild(li);

                // Add to admin dropdown
                const option = document.createElement('option');
                option.value = cat.name;
                option.textContent = cat.name;
                linkCategorySelect.appendChild(option);
            });

            // Ensure 'All Links' is active if currentCategory is 'All'
            if (currentCategory === 'All' && !document.querySelector('.sidebar-nav li.active')) {
                 document.querySelector('.sidebar-nav li a[data-category="All"]')?.parentElement.classList.add('active');
            }
        }
        
        // --- Sidebar Category Click Logic ---
        sidebarNav.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (link) {
                e.preventDefault();
                const category = link.dataset.category;
                
                if (category === currentCategory && adminPage.style.display === 'none') return; // Do nothing if already active

                // Update active state
                document.querySelector('.sidebar-nav li.active')?.classList.remove('active');
                link.parentElement.classList.add('active');
                
                currentCategory = category;
                
                // Switch to public page if not already there
                showPublicPage(); 
                // fetchAndDisplayLinks(currentCategory) is called inside showPublicPage()

                // Close mobile sidebar on selection
                if (sidebar.classList.contains('active')) {
                    sidebar.classList.remove('active');
                    sidebarOverlay.classList.remove('active');
                }
            }
        });

        // --- Fetch and Display Links (Filterable) ---
        function fetchAndDisplayLinks(categoryFilter = 'All') {
            linksContainer.innerHTML = ""; // Clear existing links
            
            const linksToDisplay = (categoryFilter === 'All')
                ? allLinksData
                : allLinksData.filter(link => (link.category || 'General') === categoryFilter);

            if (linksToDisplay.length === 0) {
                 linksContainer.innerHTML = `<p class="no-search-results">No links found${categoryFilter === 'All' ? '' : ` in "${categoryFilter}"`}.</p>`;
                return;
            }
            
             // Sort links alphabetically by name within the category
            linksToDisplay.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

            linksToDisplay.forEach(linkData => {
                const { id, name, category, url } = linkData; // ColorCode removed from link data
                const categoryInfo = allCategoriesData.find(c => c.name === category);
                
                const primaryColor = categoryInfo ? categoryInfo.color : '#60A5FA'; // Use category color or default
                const firstLetter = name ? name.charAt(0).toUpperCase() : '?'; // Get first letter, ensure uppercase

                const card = document.createElement('div');
                card.className = 'link-card';
                // Add data attributes for search
                card.dataset.name = (name || '').toLowerCase(); // Ensure name exists
                card.dataset.category = (category || 'general').toLowerCase();

                card.innerHTML = `
                    <div class="card-header" style="background-color: ${primaryColor};">
                        <div class="card-initial-circle">
                           ${firstLetter}
                        </div>
                        <button class="delete-btn" data-id="${id}">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                    <div class="card-content">
                        <div>
                            <h3 class="card-title">${name || 'Untitled'}</h3>
                            <p class="card-subtitle">${category || 'General'}</p> 
                        </div>
                        <a href="${url || '#'}" 
                           class="view-btn" 
                           target="_blank" 
                           rel="noopener noreferrer">
                            <i class="fas fa-arrow-up-right-from-square"></i>
                            VIEW
                        </a>
                    </div>
                `;
                linksContainer.appendChild(card);
            });

            // Re-attach delete listeners after links are added
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', (event) => {
                    event.stopPropagation();
                    event.preventDefault(); // Prevent link navigation if card is ever wrapped in <a>
                    const idToDelete = event.currentTarget.dataset.id;
                    deleteLink(idToDelete); // Now deleteLink is defined
                });
            });
            
            // Apply current search filter (if any)
            filterLinksBySearch();
        }
        
        // --- Search Bar Logic ---
        function filterLinksBySearch() {
            const searchTerm = searchInput.value.toLowerCase().trim(); // Trim whitespace
            const allCards = linksContainer.querySelectorAll('.link-card');
            let visibleCount = 0;
            const noResultsMsg = linksContainer.querySelector('.no-search-results'); // Get message element once

             // Clear previous no results message if search term is empty and cards exist
             if (searchTerm === '' && noResultsMsg) {
                 noResultsMsg.style.display = 'none';
             }

            allCards.forEach(card => {
                const name = card.dataset.name || '';
                const category = card.dataset.category || '';
                // Check if card belongs to the current category filter *before* searching
                const inCurrentCategory = (currentCategory === 'All') || ((card.dataset.category || 'general') === currentCategory.toLowerCase());
                
                const matchesSearch = searchTerm === '' || name.includes(searchTerm) || category.includes(searchTerm);
                
                const isVisible = inCurrentCategory && matchesSearch;
                
                card.classList.toggle('hidden', !isVisible);
                if (isVisible) {
                    visibleCount++;
                }
            });

            // Show/hide no results message based on search *within the current category*
             if (visibleCount === 0 && linksContainer.children.length > 0) { // Check if cards were rendered at all
                 const baseMsg = `No links found${currentCategory === 'All' ? '' : ` in "${currentCategory}"`}`;
                 const searchMsg = searchTerm ? ` matching "${searchInput.value}"` : '';

                if (noResultsMsg) {
                     noResultsMsg.textContent = baseMsg + searchMsg + '.';
                    noResultsMsg.style.display = 'block';
                 } else if (linksContainer.innerHTML.trim() === '') { // Only add if container is truly empty
                     linksContainer.innerHTML = `<p class="no-search-results">${baseMsg}${searchMsg}.</p>`;
                 } else if (!linksContainer.querySelector('.no-search-results')) { // Add if not present
                     const p = document.createElement('p');
                     p.className = 'no-search-results';
                     p.textContent = baseMsg + searchMsg + '.';
                     linksContainer.prepend(p); // Prepend to show at top
                 }
             } else if (noResultsMsg) {
                 noResultsMsg.style.display = 'none'; // Hide if there are results
             }
        }
        searchInput.addEventListener('input', filterLinksBySearch);

        
        // --- Fetch All Data (Main Loader) ---
        async function fetchAllData() {
            linksContainer.innerHTML = '<p class="no-search-results">Loading links...</p>'; // Show loading state
            try {
                // Fetch Categories first
                const categorySnapshot = await getDocs(categoriesCollectionRef);
                allCategoriesData = categorySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // Fetch Links
                const linksSnapshot = await getDocs(linksCollectionRef);
                allLinksData = linksSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                console.log("Data fetched:", { categories: allCategoriesData.length, links: allLinksData.length });
                 // Ensure UI updates happen after data is ready
                populateCategories(); 
                fetchAndDisplayLinks(currentCategory); 

            } catch (error) {
                console.error("Error fetching data: ", error);
                linksContainer.innerHTML = `<p class='no-search-results'>Error fetching data. Check console.</p>`;
            }
        }

        // --- Add Link Handler ---
        addLinkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Adding...';

            const newLink = {
                name: linkName.value.trim(),
                category: linkCategorySelect.value || "General",
                url: linkUrl.value.trim(),
                // colorCode is no longer used, category color is used instead
            };

            // Basic validation
             if (!newLink.name || !newLink.url) {
                 console.error("Link name and URL cannot be empty.");
                 // Add user feedback here
                 submitBtn.disabled = false;
                 submitBtn.textContent = 'Add Link';
                 return;
             }
             // Basic URL validation (can be more robust)
             try {
                 new URL(newLink.url);
             } catch (_) {
                 console.error("Invalid URL format.");
                  // Add user feedback here
                 submitBtn.disabled = false;
                 submitBtn.textContent = 'Add Link';
                 return;
             }

            try {
                const docRef = await addDoc(linksCollectionRef, newLink);
                console.log("Link added with ID: ", docRef.id);

                 // Add the new link to the local cache immediately
                allLinksData.push({ id: docRef.id, ...newLink });
                
                // Set the current category to the one just added
                currentCategory = newLink.category;
                
                // Update sidebar active state
                populateCategories(); // Repopulate to include active state correctly
                
                // Switch back to public page to see the new link
                showPublicPage(); // This will also call fetchAndDisplayLinks from cache

            } catch (error) {
                console.error("Error adding link: ", error);
                // In a real app, show a user-friendly error
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Link';
            }
        });

        // --- Authentication then Data Fetch ---
        async function initializeAndFetch() {
            try {
                // Apply theme from local storage
                const savedTheme = localStorage.getItem('theme') || 'light'; // Default to light
                applyTheme(savedTheme === 'dark');

                // Apply sidebar state from local storage
                const savedSidebarState = localStorage.getItem('sidebarState') || 'full';
                if (savedSidebarState === 'mini') {
                    sidebar.classList.add('mini');
                    mainContent.classList.add('sidebar-mini');
                } else {
                    sidebar.classList.remove('mini');
                    mainContent.classList.remove('sidebar-mini');
                }

                await signInAnonymously(auth);
                await fetchAllData(); // Fetches categories and links, then updates UI
                 
            } catch (error) {
                console.error("Error initializing Firebase: ", error);
                 linksContainer.innerHTML = `<p class='no-search-results'>Error connecting to service: ${error.message}. Please check console and ensure Firestore rules are configured.</p>`;
            }
        }
        
        // --- Initial Load ---
        initializeAndFetch();
    </script>
</body>
