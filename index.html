<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyLinks Dashboard</title>
    <!-- Font Awesome for icons --><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Fontshare Fonts -->
    <style>
        @import url('https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&f[]=nippo@700,500,400&display=swap');

        /* Modernize Dashboard Theme Colors & Variables */
        :root {
            /* Fonts */
            --font-main: 'Satoshi', sans-serif;
            --font-heading: 'Nippo', sans-serif;

            /* Light Theme */
            --light-bg-body: #F8F9FB;
            --light-bg-card: #FFFFFF;
            --light-bg-sidebar: #FFFFFF;
            --light-bg-header: #FFFFFF;
            --light-bg-modal: #FFFFFF; /* Added for modals */
            --light-text-primary: #2A3142;
            --light-text-secondary: #7C8696;
            --light-border: #E5E7EB;
            --light-shadow: rgba(0, 0, 0, 0.05);

            /* Dark Theme */
            --dark-bg-body: #111827;
            --dark-bg-card: #1f2937;
            --dark-bg-sidebar: #1f2937;
            --dark-bg-header: #1f2937;
            --dark-bg-modal: #1f2937; /* Added for modals */
            --dark-text-primary: #F8F9FB;
            --dark-text-secondary: #9CA3AF;
            --dark-border: #374151;
            --dark-shadow: rgba(0, 0, 0, 0.3);

            /* Accent Colors */
            --accent-purple: #8B5CF6;
            --accent-orange: #FBBF24;
            --accent-teal: #2DD4BF;
            --accent-red: #EF4444;
            --accent-green: #10B981;
            --accent-blue: #60A5FA;

            /* Sidebar Sizes */
            --sidebar-width-full: 280px;
            --sidebar-width-mini: 80px;
        }

        /* --- Base Layout & Typography --- */
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--light-bg-body);
            color: var(--light-text-primary);
            min-height: 100vh;
            display: flex;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        h1, h2, h3, h4, h5, h6 { margin: 0; color: var(--light-text-primary); font-family: var(--font-heading); }
        .sidebar-logo-text { font-family: var(--font-heading); }
        ::placeholder { color: var(--light-text-secondary); opacity: 0.7; }

        /* --- Dark Theme Overrides --- */
        body.dark-theme { background-color: var(--dark-bg-body); color: var(--dark-text-primary); }
        body.dark-theme h1, body.dark-theme h2, body.dark-theme h3, body.dark-theme h4, body.dark-theme h5, body.dark-theme h6 { color: var(--dark-text-primary); }
        body.dark-theme ::placeholder { color: var(--dark-text-secondary); }
        body.dark-theme .app-sidebar { background-color: var(--dark-bg-sidebar); border-right-color: var(--dark-border); }
        body.dark-theme .sidebar-logo { color: var(--dark-text-primary); }
        body.dark-theme .sidebar-nav a { color: var(--dark-text-secondary); }
        body.dark-theme .sidebar-nav a:hover, body.dark-theme .sidebar-nav li.active a { background-color: rgba(255, 255, 255, 0.08); color: var(--dark-text-primary); }
        body.dark-theme .sidebar-nav li.active a { box-shadow: none; }
        body.dark-theme .sidebar-toggle-desktop { color: var(--dark-text-secondary); }
        body.dark-theme .app-header { background-color: var(--dark-bg-header); border-bottom-color: var(--dark-border); }
        body.dark-theme .search-bar input { background-color: #2A3142; border-color: #374151; color: var(--dark-text-primary); }
        body.dark-theme .search-bar input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2); }
        body.dark-theme .search-bar .search-icon { color: var(--dark-text-secondary); }
        body.dark-theme .header-icon-button { background-color: #2A3142; color: var(--dark-text-primary); }
        body.dark-theme .header-icon-button:hover { background-color: #374151; }
        body.dark-theme .app-breadcrumbs { background-color: #1a222f; border-bottom-color: var(--dark-border); }
        body.dark-theme .app-breadcrumbs li { color: var(--dark-text-secondary); }
        body.dark-theme .app-breadcrumbs a { color: var(--dark-text-primary); }
        body.dark-theme .dashboard-grid .link-card { background-color: var(--dark-bg-card); border-color: var(--dark-border); box-shadow: 0 4px 12px var(--dark-shadow); }
        body.dark-theme .link-card .card-content { background-color: var(--dark-bg-card); }
        body.dark-theme .link-card .card-title { color: var(--dark-text-primary); }
        body.dark-theme .link-card .card-subtitle { color: var(--dark-text-secondary); }
        body.dark-theme .link-card .delete-btn { background-color: rgba(255, 255, 255, 0.1); color: var(--dark-text-primary); }
        body.dark-theme .link-card .delete-btn:hover { background-color: var(--accent-red); color: #FFFFFF; }
        body.dark-theme .admin-form-container { background-color: var(--dark-bg-card); border-color: var(--dark-border); box-shadow: 0 4px 12px var(--dark-shadow); }
        body.dark-theme .admin-form-container h2 { color: var(--dark-text-primary); }
        body.dark-theme .admin-form-container label { color: var(--dark-text-secondary); }
        body.dark-theme .admin-form-container input, body.dark-theme .admin-form-container select, body.dark-theme input[type="color"] { background-color: #2A3142; border-color: #374151; color: var(--dark-text-primary); }
        body.dark-theme input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        body.dark-theme input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
        body.dark-theme .admin-form-container ::placeholder { color: var(--dark-text-secondary); }
        body.dark-theme .app-footer { color: var(--dark-text-secondary); border-top-color: var(--dark-border); }
        body.dark-theme .modal { background-color: var(--dark-bg-modal); border: 1px solid var(--dark-border); }
        body.dark-theme .modal h2 { color: var(--dark-text-primary); }
        body.dark-theme .modal label { color: var(--dark-text-secondary); }
        body.dark-theme .modal input, body.dark-theme .modal select { background-color: #2A3142; border-color: #374151; color: var(--dark-text-primary); }
        body.dark-theme .modal table { border-color: var(--dark-border); }
        body.dark-theme .modal th, body.dark-theme .modal td { border-color: var(--dark-border); }
        body.dark-theme .modal th { background-color: #2A3142; }


        /* --- App Container & Main Content --- */
        .app-container { flex-grow: 1; display: flex; flex-direction: column; min-height: 100vh; width: calc(100% - var(--sidebar-width-full)); transition: width 0.3s ease; }
        .app-container.sidebar-mini { width: calc(100% - var(--sidebar-width-mini)); }
        .app-main-content { flex-grow: 1; padding: 20px; padding-bottom: 40px; max-width: 100%; }
        .container { max-width: 1200px; margin: 0 auto; }


        /* --- Sidebar (app-sidebar) --- */
        .app-sidebar { width: var(--sidebar-width-full); background-color: var(--light-bg-sidebar); border-right: 1px solid var(--light-border); flex-shrink: 0; height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; transition: width 0.3s ease, background-color 0.3s ease, border-color 0.3s ease; box-shadow: 0 2px 10px var(--light-shadow); }
        .sidebar-logo { font-size: 1.5rem; font-weight: 700; color: var(--light-text-primary); padding: 24px 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; overflow: hidden; position: relative; }
        .sidebar-logo-content { display: flex; align-items: center; gap: 10px; overflow: hidden; flex-grow: 1; }
        .sidebar-logo .fa-layer-group { color: var(--accent-blue); font-size: 1.8rem; }
        .sidebar-logo-text { transition: opacity 0.2s ease, width 0.2s ease; white-space: nowrap; }
        .sidebar-toggle-desktop { background: none; border: none; color: var(--light-text-secondary); padding: 5px; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; width: 36px; height: 36px; flex-shrink: 0; transition: background-color 0.2s ease, color 0.2s ease; }
        .sidebar-toggle-desktop:hover { color: var(--light-text-primary); background-color: #F0F2F5; }
        body.dark-theme .sidebar-toggle-desktop { color: var(--dark-text-secondary); }
        body.dark-theme .sidebar-toggle-desktop:hover { color: var(--dark-text-primary); background-color: rgba(255, 255, 255, 0.08); }
        .sidebar-nav-container { padding: 0 20px; overflow-y: auto; flex-grow: 1; padding-bottom: 20px; }
        .sidebar-nav-title { font-size: 0.75rem; font-weight: 600; color: var(--light-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 10px; margin-top: 15px; white-space: nowrap; overflow: hidden; transition: opacity 0.2s ease; }
        .sidebar-nav { list-style: none; padding: 0; margin: 0; }
        .sidebar-nav li a { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 500; color: var(--light-text-secondary); transition: background-color 0.2s ease, color 0.2s ease; white-space: nowrap; overflow: hidden; font-size: 0.9rem; }
        .sidebar-nav li a:hover { background-color: #F0F2F5; color: var(--light-text-primary); }
        .sidebar-nav li.active a { background-color: var(--accent-blue); color: #FFFFFF; box-shadow: 0 4px 10px rgba(96, 165, 250, 0.3); }
        .sidebar-nav li a .fa-fw { width: 1.25em; text-align: center; flex-shrink: 0; font-size: 1.1rem; }
        .sidebar-nav li.active a .fa-fw { color: #FFFFFF; }
        .app-sidebar.mini { width: var(--sidebar-width-mini); }
        .app-sidebar.mini .sidebar-logo { padding-left: 0; padding-right: 0; justify-content: center; }
        .app-sidebar.mini .sidebar-logo-content { width: 0; opacity: 0; visibility: hidden; }
        .app-sidebar.mini .sidebar-logo-text { opacity: 0; width: 0; visibility: hidden; }
        .app-sidebar.mini .sidebar-nav-container { padding: 0 10px; }
        .app-sidebar.mini .sidebar-nav-title { opacity: 0; height: 0; padding: 0; margin: 0; }
        .app-sidebar.mini .sidebar-nav li a { justify-content: center; }
        .app-sidebar.mini .sidebar-nav li a span { opacity: 0; width: 0; visibility: hidden; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 998; }


        /* --- App Header (Navbar) --- */
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: var(--light-bg-header); border-bottom: 1px solid var(--light-border); flex-shrink: 0; box-shadow: 0 2px 5px var(--light-shadow); transition: background-color 0.3s ease, border-color 0.3s ease; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        .mobile-sidebar-toggle { background: none; border: none; color: var(--light-text-secondary); font-size: 1.3rem; cursor: pointer; padding: 8px; border-radius: 50%; transition: color 0.3s ease, background-color 0.3s ease; display: none; }
        .mobile-sidebar-toggle:hover { background-color: #F0F2F5; color: var(--light-text-primary); }
        body.dark-theme .mobile-sidebar-toggle { color: var(--dark-text-secondary); }
        body.dark-theme .mobile-sidebar-toggle:hover { background-color: #374151; color: var(--dark-text-primary); }
        .search-bar { position: relative; width: 300px; }
        .search-bar .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--light-text-secondary); }
        .search-bar input { width: 100%; padding: 10px 15px 10px 40px; background-color: #F0F2F5; border: 1px solid var(--light-border); border-radius: 8px; color: var(--light-text-primary); font-family: var(--font-main); font-size: 0.9rem; transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s; }
        .search-bar input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2); }
        .header-icon-button { background-color: #F0F2F5; color: var(--light-text-secondary); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s ease, color 0.2s ease; }
        .header-icon-button:hover { background-color: #E5E7EB; color: var(--light-text-primary); }


        /* --- App Breadcrumbs --- */
        .app-breadcrumbs { padding: 12px 30px; background-color: #F0F2F5; border-bottom: 1px solid var(--light-border); flex-shrink: 0; transition: background-color 0.3s ease, border-color 0.3s ease; font-size: 0.9rem; }
        .app-breadcrumbs ul { margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 8px; }
        .app-breadcrumbs li { color: var(--light-text-secondary); }
        .app-breadcrumbs li:not(:last-child)::after { content: '/'; margin-left: 8px; color: var(--light-text-secondary); }
        .app-breadcrumbs a { color: var(--light-text-primary); text-decoration: none; font-weight: 500; }
        .app-breadcrumbs a:hover { text-decoration: underline; }

        /* --- Dashboard Grid & Link Cards --- */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .dashboard-grid .no-search-results { grid-column: 1 / -1; text-align: center; color: var(--light-text-secondary); margin-top: 40px; font-size: 1.1rem; }
        .link-card { background-color: var(--light-bg-card); border-radius: 12px; box-shadow: 0 4px 12px var(--light-shadow); position: relative; height: 180px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--light-border); transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease; }
        .link-card.hidden { display: none; }
        .link-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px var(--light-shadow); }
        .card-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background-size: cover; background-position: center; border-top-left-radius: 12px; border-top-right-radius: 12px; height: 80px; position: relative; z-index: 1; }
        .card-initial-circle { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background-color: rgba(255, 255, 255, 0.3); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); color: #FFFFFF; font-size: 1.5rem; font-weight: 600; flex-shrink: 0; font-family: var(--font-heading); text-transform: uppercase; }
        .delete-btn { background-color: rgba(0, 0, 0, 0.2); border: none; color: #FFFFFF; font-size: 1rem; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s, color 0.2s; z-index: 10; }
        .delete-btn:hover { background-color: var(--accent-red); color: #FFFFFF; }
        .card-content { flex-grow: 1; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; background-color: var(--light-bg-card); border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; border-top: 1px solid var(--light-border); transition: background-color 0.2s ease, border-color 0.2s ease; }
        body.dark-theme .card-content { border-top-color: var(--dark-border); }
        .card-title { font-size: 1rem; font-weight: 600; color: var(--light-text-primary); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-subtitle { font-size: 0.85rem; color: var(--light-text-secondary); margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .view-btn { width: 100%; padding: 8px 15px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; text-decoration: none; cursor: pointer; transition: background-color 0.2s ease, box-shadow 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; color: #FFFFFF; background-color: var(--accent-blue); border: none; }
        .view-btn:hover { filter: brightness(1.1); box-shadow: 0 2px 10px rgba(96, 165, 250, 0.3); }
        
        /* --- Admin Form Page --- */
        .admin-form-container { max-width: 600px; margin: 40px auto; padding: 30px; background-color: var(--light-bg-card); border-radius: 8px; box-shadow: 0 4px 12px var(--light-shadow); border: 1px solid var(--light-border); transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease; }
        .admin-form-container h2 { font-family: var(--font-main); font-weight: 700; text-align: center; margin-top: 0; margin-bottom: 30px; color: var(--light-text-primary); }
        .admin-form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; } /* New header for title and customize button */
        .customize-btn { background-color: #F0F2F5; color: var(--light-text-secondary); border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: background-color 0.2s, color 0.2s; }
        .customize-btn:hover { background-color: #E5E7EB; color: var(--light-text-primary); }
        body.dark-theme .customize-btn { background-color: #2A3142; color: var(--dark-text-secondary); }
        body.dark-theme .customize-btn:hover { background-color: #374151; color: var(--dark-text-primary); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--light-text-secondary); font-size: 0.9rem; }
        .form-group input[type="color"] { padding: 2px; height: 44px; cursor: pointer; border-radius: 8px; background-color: #F8F9FB; border: 1px solid var(--light-border); width: 100%; box-sizing: border-box; }
        .form-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 4px; }
        .form-group input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(0,0,0,0.1); border-radius: 4px; }
        body.dark-theme .form-group input[type="color"] { background-color: #2A3142; border-color: #374151; }
        body.dark-theme .form-group input[type="color"]::-webkit-color-swatch { border: none; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--light-border); background-color: #F8F9FB; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; font-family: var(--font-main); color: var(--light-text-primary); transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease; }
        .form-group input:focus, .form-group select:focus, .form-group input[type="color"]:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2); }
        #link-category-new, #link-category-icon-new { display: none; margin-top: 10px; }
        .admin-form-container button[type="submit"] { width: 100%; padding: 12px; font-size: 1.1rem; font-weight: 600; background-color: var(--accent-blue); color: white; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.3s ease, box-shadow 0.3s ease; margin-top: 20px; }
        .admin-form-container button[type="submit"]:hover { background-color: #4F8CE3; box-shadow: 0 4px 15px rgba(96, 165, 250, 0.4); }
        
        /* --- Footer --- */
        .app-footer { text-align: center; padding: 20px 30px; margin-top: auto; color: var(--light-text-secondary); font-size: 0.85rem; border-top: 1px solid var(--light-border); transition: color 0.3s ease, border-color 0.3s ease; flex-shrink: 0; }

        /* --- Modals --- */
        .modal-overlay { display: none; position: fixed; inset: 0; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background-color: var(--light-bg-modal); border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 600px; /* Default for category list */ border: 1px solid var(--light-border); }
        .modal-small { max-width: 400px; } /* For add/edit form */
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--light-border); padding-bottom: 15px; }
        .modal-header h2 { font-size: 1.25rem; font-weight: 600; }
        .modal-close-btn { background: none; border: none; font-size: 1.5rem; color: var(--light-text-secondary); cursor: pointer; padding: 5px; line-height: 1; }
        .modal-close-btn:hover { color: var(--light-text-primary); }
        body.dark-theme .modal-close-btn { color: var(--dark-text-secondary); }
        body.dark-theme .modal-close-btn:hover { color: var(--dark-text-primary); }
        .modal-content { max-height: 60vh; overflow-y: auto; }
        .modal-actions { margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--light-border); padding-top: 20px; }
        .modal button { padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: background-color 0.2s, color 0.2s; border: 1px solid transparent; }
        .modal .btn-primary { background-color: var(--accent-blue); color: #fff; }
        .modal .btn-primary:hover { background-color: #4F8CE3; }
        .modal .btn-secondary { background-color: #F0F2F5; color: var(--light-text-primary); border-color: var(--light-border); }
        .modal .btn-secondary:hover { background-color: #E5E7EB; }
        .modal .btn-danger { background-color: var(--accent-red); color: #fff; }
        .modal .btn-danger:hover { background-color: #D93737; }
        body.dark-theme .modal .btn-secondary { background-color: #374151; color: var(--dark-text-primary); border-color: #4b5563; }
        body.dark-theme .modal .btn-secondary:hover { background-color: #4b5563; }
        .modal .form-group { margin-bottom: 15px; } /* Tighter spacing in modal forms */
        .modal .form-group label { margin-bottom: 6px; font-size: 0.85rem; }
        .modal .form-group input, .modal .form-group select { padding: 10px; font-size: 0.9rem; }
        .modal input[type="color"] { height: 40px; } /* Slightly smaller color picker */

        /* Category Table Styles */
        .category-table-wrapper { overflow-x: auto; }
        .category-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .category-table th, .category-table td { padding: 12px 15px; text-align: left; border: 1px solid var(--light-border); font-size: 0.9rem; }
        .category-table th { background-color: #F0F2F5; font-weight: 600; color: var(--light-text-secondary); }
        .category-table td { color: var(--light-text-primary); }
        .category-table .color-swatch { display: inline-block; width: 20px; height: 20px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); vertical-align: middle; margin-right: 8px; }
        .category-table .icon-preview { font-size: 1.1rem; width: 1.5em; text-align: center; display: inline-block; vertical-align: middle; margin-right: 8px;}
        .category-table .actions { display: flex; gap: 8px; }
        .category-table .actions button { background: none; border: none; padding: 5px; cursor: pointer; font-size: 1rem; color: var(--light-text-secondary); }
        .category-table .actions button:hover { color: var(--accent-blue); }

                    <button type="button" class="btn-secondary modal-close-btn" data-target="category-edit-modal">Cancel</button>
                </div>

    <!-- Javascript (uses latest Firebase Modular SDK) -->
    <script type="module">
        // --- Firebase Imports ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, setLogLevel, updateDoc, writeBatch, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"; // Added updateDoc, writeBatch, query, where
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyBquWSZVVwJITsN_H943-Fx2Z9uf-V9JQQ",
            authDomain: "suuu-5293b.firebaseapp.com",
            projectId: "suuu-5293b",
            storageBucket: "suuu-5293b.appspot.com",
            messagingSenderId: "1004581080357",
            appId: "1:1004581080357:web:c84ebb279776ad171e1ecc",
            measurementId: "G-KSWY1KL4BS"
        };
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- Collections ---
        const linksCollectionRef = collection(db, "links");
        const categoriesCollectionRef = collection(db, "categories"); // Updated reference name

        try { setLogLevel('debug'); } catch (e) {}

        // --- DOM Elements ---
        const body = document.body;
        const sidebar = document.getElementById('sidebar');
        const sidebarNav = document.getElementById('sidebar-nav');
        const mobileSidebarToggle = document.getElementById('mobile-sidebar-toggle');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const sidebarToggleDesktop = document.getElementById('sidebar-toggle-desktop');
        const mainContent = document.getElementById('main-content');
        const publicPage = document.getElementById('public-page');
        const adminPage = document.getElementById('admin-page');
        const addBtn = document.getElementById('add-btn');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const fullscreenToggleBtn = document.getElementById('fullscreen-toggle');
        const linksContainer = document.getElementById('links-container');
        const addLinkForm = document.getElementById('add-link-form');
        const linkName = document.getElementById('link-name');
        const linkCategorySelect = document.getElementById('link-category-select');
        // Removed linkCategoryNew, linkCategoryIconNew
        const linkUrl = document.getElementById('link-url');
        // Removed linkColorInput
        const submitBtn = document.getElementById('submit-btn');
        const breadcrumbList = document.getElementById('breadcrumb-list');
        const searchInput = document.getElementById('search-input');
        const customizeCategoriesBtn = document.getElementById('customize-categories-btn');
        const categoryListModal = document.getElementById('category-list-modal');
        const categoryEditModal = document.getElementById('category-edit-modal');
        const categoryTableBody = document.querySelector('#category-table tbody');
        const addNewCategoryBtn = document.getElementById('add-new-category-btn');
        const categoryEditForm = document.getElementById('category-edit-form');
        const categoryEditTitle = document.getElementById('category-edit-title');
        const categoryEditId = document.getElementById('category-edit-id');
        const categoryEditOriginalName = document.getElementById('category-edit-original-name');
        const categoryEditName = document.getElementById('category-edit-name');
        const categoryEditIcon = document.getElementById('category-edit-icon');
        const categoryEditColor = document.getElementById('category-edit-color');
        const categorySaveBtn = document.getElementById('category-save-btn');

        let allLinksData = []; // Cache for links
        let allCategoriesData = []; // Cache for categories [{id, name, icon, color}]
        let currentCategory = 'All'; // State for active category

        // --- Theme Toggle Logic ---
        function applyTheme(isDark) { /* ... (no changes) ... */ }
        themeToggleBtn.addEventListener('click', () => { /* ... (no changes) ... */ });
        
        // --- Fullscreen Toggle Logic ---
        fullscreenToggleBtn.addEventListener('click', () => { /* ... (no changes) ... */ });
        document.addEventListener('fullscreenchange', () => { /* ... (no changes) ... */ });

        // --- Sidebar Toggle Logic (Mobile & Desktop) ---
        mobileSidebarToggle.addEventListener('click', () => { /* ... (no changes) ... */ });
        sidebarOverlay.addEventListener('click', () => { /* ... (no changes) ... */ });
        sidebarToggleDesktop.addEventListener('click', () => { /* ... (no changes) ... */ });

        // --- Admin Page Toggle Logic ---
        function showAdminPage() { /* ... (no changes except removing category inputs) ... */ }
        function showPublicPage() { /* ... (no changes) ... */ }
        addBtn.addEventListener('click', showAdminPage);
        
        // --- Modal Handling ---
        function openModal(modalId) {
            document.getElementById(modalId)?.classList.add('active');
        }
        function closeModal(modalId) {
            document.getElementById(modalId)?.classList.remove('active');
        }
        document.querySelectorAll('.modal-close-btn').forEach(btn => {
            btn.addEventListener('click', () => closeModal(btn.dataset.target));
        });
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeModal(overlay.id);
            });
        });

        // --- Customize Categories Button ---
        customizeCategoriesBtn.addEventListener('click', () => {
            populateCategoryTable();
            openModal('category-list-modal');
        });

        // --- Populate Category Management Table ---
        function populateCategoryTable() {
            categoryTableBody.innerHTML = ''; // Clear existing rows
            const sortedCategories = [...allCategoriesData].sort((a,b) => a.name.localeCompare(b.name));

            sortedCategories.forEach(cat => {
                const row = categoryTableBody.insertRow();
                row.innerHTML = `
                    <td>${cat.name}</td>
                    <td><i class="fas ${cat.icon} icon-preview"></i> (${cat.icon})</td>
                    <td><span class="color-swatch" style="background-color: ${cat.color};"></span> ${cat.color}</td>
                    <td class="actions">
                        <button class="edit-cat-btn" data-id="${cat.id}" title="Edit"><i class="fas fa-pencil-alt"></i></button>
                        <button class="delete-cat-btn" data-id="${cat.id}" title="Delete"><i class="fas fa-trash-alt"></i></button>
                    </td>
                `;
            });

            // Add event listeners for edit/delete buttons
            categoryTableBody.querySelectorAll('.edit-cat-btn').forEach(btn => {
                btn.addEventListener('click', () => openCategoryEditModal(btn.dataset.id));
            });
            categoryTableBody.querySelectorAll('.delete-cat-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteCategory(btn.dataset.id));
            });
        }

        // --- Open Add/Edit Category Modal ---
        function openCategoryEditModal(categoryId = null) {
            categoryEditForm.reset();
            categoryEditId.value = categoryId || ''; // Store ID if editing
            
            if (categoryId) {
                const category = allCategoriesData.find(c => c.id === categoryId);
                if (category) {
                    categoryEditTitle.textContent = 'Edit Category';
                    categoryEditName.value = category.name;
                    categoryEditIcon.value = category.icon;
                    categoryEditColor.value = category.color;
                    categoryEditOriginalName.value = category.name; // Store original name for potential link updates
                } else {
                    console.error("Category not found for editing:", categoryId);
                    return; // Should not happen
                }
            } else {
                categoryEditTitle.textContent = 'Add New Category';
                categoryEditOriginalName.value = ''; // Clear original name for add
            }
            openModal('category-edit-modal');
        }

        addNewCategoryBtn.addEventListener('click', () => openCategoryEditModal());

        // --- Save Category (Add or Edit) ---
        categoryEditForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = categoryEditId.value;
            const name = categoryEditName.value.trim();
            const icon = categoryEditIcon.value.trim() || 'fas fa-bookmark'; // Default icon
            const color = categoryEditColor.value;
            const originalName = categoryEditOriginalName.value; // Get original name

            if (!name) {
                alert('Category name cannot be empty.');
                return;
            }

            categorySaveBtn.disabled = true;
            categorySaveBtn.textContent = 'Saving...';

            try {
                if (id) { // Editing existing
                    const categoryRef = doc(db, "categories", id);
                    await updateDoc(categoryRef, { name, icon, color });
                    
                    // If name changed, update all links using the old name
                    if (name !== originalName && originalName) {
                        const batch = writeBatch(db);
                        const q = query(linksCollectionRef, where("category", "==", originalName));
                        const linkSnapshot = await getDocs(q);
                        linkSnapshot.forEach(linkDoc => {
                            batch.update(linkDoc.ref, { category: name });
                        });
                        await batch.commit();
                        console.log(`Updated ${linkSnapshot.size} links from category "${originalName}" to "${name}".`);
                    }
                    alert('Category updated successfully!');

                } else { // Adding new
                     // Check if category name already exists
                    if (allCategoriesData.some(cat => cat.name.toLowerCase() === name.toLowerCase())) {
                        alert(`Category "${name}" already exists.`);
                        categorySaveBtn.disabled = false;
                        categorySaveBtn.textContent = 'Save Category';
                        return;
                    }
                    await addDoc(categoriesCollectionRef, { name, icon, color });
                    alert('Category added successfully!');
                }
                
                closeModal('category-edit-modal');
                await fetchAllData(); // Refetch all data
                populateCategoryTable(); // Update table in list modal
                populateCategories(); // Update sidebar and admin dropdown
                fetchAndDisplayLinks(currentCategory); // Refresh displayed links

            } catch (error) {
                console.error("Error saving category: ", error);
                alert('Error saving category. Please check console.');
            } finally {
                categorySaveBtn.disabled = false;
                categorySaveBtn.textContent = 'Save Category';
            }
        });


        // --- Delete Category ---
        async function deleteCategory(categoryId) {
            const categoryToDelete = allCategoriesData.find(c => c.id === categoryId);
            if (!categoryToDelete) return;

            // **Check if category is in use by any links**
            const linksUsingCategory = allLinksData.filter(link => (link.category || 'General') === categoryToDelete.name);

            if (linksUsingCategory.length > 0) {
                alert(`Cannot delete category "${categoryToDelete.name}" because ${linksUsingCategory.length} link(s) are still using it. Please reassign those links first.`);
                return;
            }
            
            // Proceed with deletion if not in use
            if (confirm(`Are you sure you want to delete the category "${categoryToDelete.name}"? This action cannot be undone.`)) {
                try {
                    await deleteDoc(doc(db, "categories", categoryId));
                    alert('Category deleted successfully!');
                    
                    // Refetch, repopulate, redisplay
                    await fetchAllData();
                    populateCategoryTable();
                    populateCategories();
                    // If the deleted category was the current filter, switch to 'All'
                    if (currentCategory === categoryToDelete.name) {
                        currentCategory = 'All';
                        // Update active state in sidebar after repopulating
                        sidebarNav.querySelectorAll('li').forEach(li => li.classList.remove('active'));
                        sidebarNav.querySelector('a[data-category="All"]').closest('li').classList.add('active');
                    }
                    fetchAndDisplayLinks(currentCategory);

                } catch (error) {
                    console.error("Error deleting category: ", error);
                    alert('Error deleting category. Please check console.');
                }
            }
        }


        // --- Populate Categories (Sidebar & Admin Dropdown) ---
        function populateCategories() {
            const categoryNames = allCategoriesData.map(c => c.name);
            const allCategoryNamesSet = new Set(categoryNames); // Use Set for quick checks

             // Populate Sidebar
            sidebarNav.innerHTML = ''; // Clear existing
            const allLink = document.createElement('li');
            allLink.innerHTML = `<a href="#" data-category="All"><i class="fas fa-fw fa-border-all"></i> <span>All Links</span></a>`;
            if (currentCategory === 'All') allLink.classList.add('active');
            sidebarNav.appendChild(allLink);

            const sortedCategories = [...allCategoriesData].sort((a,b) => a.name.localeCompare(b.name));

            sortedCategories.forEach(cat => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="#" data-category="${cat.name}"><i class="fas fa-fw ${cat.icon}"></i> <span>${cat.name}</span></a>`;
                if (currentCategory === cat.name) li.classList.add('active');
                sidebarNav.appendChild(li);
            });

            // Populate Admin Select
            const currentSelectValue = linkCategorySelect.value;
            linkCategorySelect.innerHTML = ''; // Clear existing
            
            sortedCategories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.name;
                option.textContent = cat.name;
                linkCategorySelect.appendChild(option);
            });
            
            // Try to restore previous selection or default
            if (allCategoryNamesSet.has(currentSelectValue)) {
                linkCategorySelect.value = currentSelectValue;
            } else if (sortedCategories.length > 0) {
                 linkCategorySelect.value = sortedCategories[0].name; // default to first if exists
            } else {
                 // Handle case with no categories yet (maybe add a placeholder?)
                 const defaultOption = document.createElement('option');
                 defaultOption.textContent = 'No categories defined';
                 defaultOption.disabled = true;
                 linkCategorySelect.appendChild(defaultOption);
            }
        }
        
        // --- Sidebar Category Click Logic ---
        sidebarNav.addEventListener('click', (e) => { /* ... (no changes) ... */ });


        // --- Fetch and Display Links (Filterable) ---
        function fetchAndDisplayLinks(categoryFilter = 'All') {
            linksContainer.innerHTML = ""; // Clear existing links
            
            const linksToDisplay = (categoryFilter === 'All')
                ? allLinksData
                : allLinksData.filter(link => (link.category || 'General') === categoryFilter);

            if (linksToDisplay.length === 0) {
                 linksContainer.innerHTML = `<p class="no-search-results">No links found${categoryFilter === 'All' ? '' : ` in "${categoryFilter}"`}.</p>`;
                return;
            }
            
            linksToDisplay.forEach(linkData => {
                const { id, name, category, url } = linkData; // ColorCode removed from link data
                const categoryInfo = allCategoriesData.find(c => c.name === category);
                
                const primaryColor = categoryInfo ? categoryInfo.color : '#60A5FA'; // Use category color or default
                const firstLetter = name ? name.charAt(0) : '?'; // Get first letter

                const card = document.createElement('div');
                card.className = 'link-card';
                // Add data attributes for search
                card.dataset.name = name.toLowerCase();
                card.dataset.category = (category || 'general').toLowerCase();

                card.innerHTML = `
                    <div class="card-header" style="background-color: ${primaryColor};">
                        <div class="card-initial-circle">
                           ${firstLetter}
                        </div>
                        <button class="delete-btn" data-id="${id}">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                    <div class="card-content">
                        <div>
                            <h3 class="card-title">${name}</h3>
                            <p class="card-subtitle">${category || '&nbsp;'}</p> 
                        </div>
                        <a href="${url}" 
                           class="view-btn" 
                           target="_blank" 
                           rel="noopener noreferrer">
                            <i class="fas fa-arrow-up-right-from-square"></i>
                            VIEW
                        </a>
                    </div>
                `;
                linksContainer.appendChild(card);
            });

            // Re-attach delete listeners
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', (event) => {
                    event.stopPropagation();
                    const idToDelete = event.currentTarget.dataset.id;
                    deleteLink(idToDelete);
                });
            });
            
            // Apply current search filter (if any)
            filterLinksBySearch();
        }
        
        // --- Search Bar Logic ---
        function filterLinksBySearch() { /* ... (no changes) ... */ }
        searchInput.addEventListener('input', filterLinksBySearch);

        
        // --- Fetch All Data (Main Loader) ---
        async function fetchAllData() {
            if (!db) { /* ... (no changes) ... */ }
            try {
                 linksContainer.innerHTML = "<p class='no-search-results'>Loading...</p>"; // Changed message slightly
                
                // 1. Fetch Categories
                allCategoriesData = []; // Clear cache
                const categorySnapshot = await getDocs(categoriesCollectionRef); // Use correct ref
                categorySnapshot.forEach((doc) => {
                    allCategoriesData.push({ id: doc.id, ...doc.data() }); // Store full category data
                });
                
                // 2. Fetch Links
                const linkSnapshot = await getDocs(linksCollectionRef); // Use correct ref
                allLinksData = []; // Clear cache
                linkSnapshot.forEach((doc) => {
                    allLinksData.push({ id: doc.id, ...doc.data() }); // Store full link data
                });
                
                // Sort links alphabetically by name
                allLinksData.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                
            } catch (error) { /* ... (no changes) ... */ }
        }

        // --- Add Link Handler ---
        addLinkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = linkName.value;
            const category = linkCategorySelect.value; // Just get selected value
            const url = linkUrl.value;
            // Color is now determined by category, no need to get it here

            if (!category) {
                 alert('No category selected. Please add or select a category first.');
                 return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Adding...';
            
            try {
                // Add the new link
                await addDoc(linksCollectionRef, { // Use correct ref
                    name: name,
                    category: category,
                    url: url,
                    // No colorCode needed here
                });

                alert('Link added successfully!');
                addLinkForm.reset();
                // No color picker to reset
                
                // Refetch links (categories don't change here)
                await fetchAllData(); // Refetching all might be needed if category list was empty
                populateCategories(); // Ensure dropdown is correct
                fetchAndDisplayLinks(currentCategory); 
                showPublicPage(); // Go back to public page
                
                // Replace Back button with Add button
                const backBtn = document.querySelector('.header-controls .header-icon-button[title="Back to Home"]');
                if (backBtn) backBtn.replaceWith(addBtn);

            } catch (error) {
                console.error("Error adding link: ", error);
                alert('Error adding link. Please check console.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Link';
            }
        });

        // --- Authentication then Data Fetch ---
        async function initializeAndFetch() {
            try {
                // Apply theme from local storage
                const savedTheme = localStorage.getItem('theme') || 'light'; // Default to light
                applyTheme(savedTheme === 'dark');

                // Apply sidebar state from local storage
                const savedSidebarState = localStorage.getItem('sidebarState') || 'full';
                if (savedSidebarState === 'mini') {
                    sidebar.classList.add('mini');
                    mainContent.classList.add('sidebar-mini');
                } else {
                    sidebar.classList.remove('mini');
                    mainContent.classList.remove('sidebar-mini');
                }

                await signInAnonymously(auth);
                await fetchAllData(); // Fetches both categories and links now
                populateCategories(); // Populates sidebar and admin dropdown
                fetchAndDisplayLinks(currentCategory); 
            } catch (error) {
                console.error("Error initializing Firebase: ", error);
                 linksContainer.innerHTML = `<p class='no-search-results'>Error connecting to service: ${error.message}. Please check console and ensure Firestore rules are configured.</p>`;
            }
        }
        
        // --- Initial Load ---
        initializeAndFetch();
    </script>
</body>
</html>
